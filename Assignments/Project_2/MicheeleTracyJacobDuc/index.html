<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StarStruck // Portal Hub</title>
    <link rel="stylesheet" href="tourbot.css" />
    <style>
      :root {
        --void: #020510;
        --glow-cyan: #5ad8ff;
        --glow-pink: #ff6ad5;
        --glow-gold: #ffcc66;
        --glow-purple: #aa66ff;
        --text: #e8ecff;
        --muted: #7a82a6;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: "Courier New", Courier, monospace;
        color: var(--text);
        background: var(--void);
      }

      .space-bg {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(ellipse at 50% 50%, rgba(20, 40, 80, 0.4) 0%, transparent 60%),
          linear-gradient(180deg, #010205 0%, #030812 50%, #010308 100%);
      }

      .stars {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      .star {
        position: absolute;
        border-radius: 50%;
        background: #fff;
        animation: twinkle var(--d, 3s) ease-in-out infinite var(--t, 0s);
      }

      @keyframes twinkle {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }

      .solar-container {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotateX(75deg);
        transform-style: preserve-3d;
        width: 900px;
        height: 900px;
      }

      .orbit {
        position: absolute;
        top: 50%;
        left: 50%;
        border: 1px solid rgba(100, 150, 200, 0.2);
        border-radius: 50%;
        transform: translate(-50%, -50%);
      }

      .orbit-1 { width: 200px; height: 200px; }
      .orbit-2 { width: 340px; height: 340px; }
      .orbit-3 { width: 500px; height: 500px; }
      .orbit-4 { width: 680px; height: 680px; }
      .orbit-5 { width: 860px; height: 860px; }

      .sun {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotateX(-75deg);
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #fff 0%, #ffee55 15%, #ffaa00 45%, #ff6600 75%, #cc2200 100%);
        box-shadow:
          0 0 60px rgba(255, 170, 0, 1),
          0 0 120px rgba(255, 100, 0, 0.8),
          0 0 200px rgba(255, 60, 0, 0.5);
        cursor: default;
        z-index: 100;
      }

      .sun-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        pointer-events: none;
      }

      .sun-text h2 {
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: #220800;
        text-shadow: 0 0 5px rgba(255, 255, 200, 0.8);
      }

      .sun-text span {
        font-size: 0.45rem;
        letter-spacing: 0.1em;
        color: #441000;
      }

      .planet-orbit {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        animation: spin var(--speed, 30s) linear infinite;
        pointer-events: none;
      }

      .po-1 { width: 200px; height: 200px; --speed: 20s; }
      .po-2 { width: 340px; height: 340px; --speed: 35s; animation-direction: reverse; }
      .po-3 { width: 500px; height: 500px; --speed: 50s; }
      .po-4 { width: 680px; height: 680px; --speed: 70s; animation-direction: reverse; }
      .po-5 { width: 860px; height: 860px; --speed: 95s; }

      @keyframes spin {
        from { transform: translate(-50%, -50%) rotate(0deg); }
        to { transform: translate(-50%, -50%) rotate(360deg); }
      }

      .planet {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translate(-50%, -50%) rotateX(-75deg);
        border-radius: 50%;
        cursor: pointer;
        pointer-events: auto;
        text-decoration: none;
        transition: transform 0.25s ease, box-shadow 0.25s ease;
        z-index: 50;
      }

      .planet:hover {
        transform: translate(-50%, -50%) rotateX(-75deg) scale(1.25);
      }

      .planet-glow {
        position: absolute;
        inset: -15px;
        border-radius: 50%;
        opacity: 0;
        transition: opacity 0.25s ease;
        pointer-events: none;
      }

      .planet:hover .planet-glow {
        opacity: 1;
      }

      .planet-sphere {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        position: relative;
        overflow: hidden;
      }

      .planet-sphere::after {
        content: "";
        position: absolute;
        top: 12%;
        left: 18%;
        width: 30%;
        height: 22%;
        background: rgba(255, 255, 255, 0.5);
        border-radius: 50%;
        filter: blur(4px);
      }

      .planet-label {
        position: absolute;
        top: 50%;
        left: calc(100% + 15px);
        transform: translateY(-50%);
        white-space: nowrap;
        padding: 8px 14px;
        background: rgba(5, 10, 25, 0.92);
        border: 1px solid var(--c, rgba(255,255,255,0.3));
        border-radius: 8px;
        backdrop-filter: blur(8px);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s ease;
      }

      .planet:hover .planet-label {
        opacity: 1;
      }

      .planet-label .name {
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--c, #fff);
      }

      .planet-label .tier {
        font-size: 0.55rem;
        letter-spacing: 0.1em;
        color: var(--muted);
        margin-top: 3px;
      }

      .p1 { width: 42px; height: 42px; }
      .p1 .planet-sphere {
        background: radial-gradient(circle at 30% 30%, #e0d0c0 0%, #a09080 50%, #605040 100%);
        box-shadow: inset -6px -6px 15px rgba(0,0,0,0.5), 0 0 20px rgba(180, 160, 140, 0.5);
      }
      .p1 .planet-glow { background: radial-gradient(circle, rgba(180,160,140,0.5) 0%, transparent 70%); }
      .p1:hover .planet-sphere { box-shadow: inset -6px -6px 15px rgba(0,0,0,0.5), 0 0 40px rgba(180, 160, 140, 0.8); }
      .p1 .planet-label { --c: #c0b0a0; }

      .p2 { width: 55px; height: 55px; }
      .p2 .planet-sphere {
        background: radial-gradient(circle at 30% 30%, #ffe0a0 0%, #e6a040 50%, #a06020 100%);
        box-shadow: inset -8px -8px 20px rgba(0,0,0,0.4), 0 0 25px rgba(255, 180, 80, 0.6);
      }
      .p2 .planet-glow { background: radial-gradient(circle, rgba(255,180,80,0.5) 0%, transparent 70%); }
      .p2:hover .planet-sphere { box-shadow: inset -8px -8px 20px rgba(0,0,0,0.4), 0 0 50px rgba(255, 180, 80, 0.9); }
      .p2 .planet-label { --c: var(--glow-gold); }

      .p3 { width: 70px; height: 70px; }
      .p3 .planet-sphere {
        background: radial-gradient(circle at 30% 30%, #b0e8ff 0%, #40a8e0 40%, #2070a0 70%, #103860 100%);
        box-shadow: inset -10px -10px 25px rgba(0,0,0,0.4), 0 0 35px rgba(90, 216, 255, 0.7);
      }
      .p3 .planet-glow { background: radial-gradient(circle, rgba(90,216,255,0.6) 0%, transparent 70%); }
      .p3:hover .planet-sphere { box-shadow: inset -10px -10px 25px rgba(0,0,0,0.4), 0 0 70px rgba(90, 216, 255, 1); }
      .p3 .planet-label { --c: var(--glow-cyan); }

      .p4 { width: 58px; height: 58px; }
      .p4 .planet-sphere {
        background: radial-gradient(circle at 30% 30%, #ffc0e0 0%, #e050a0 40%, #a02070 70%, #601040 100%);
        box-shadow: inset -8px -8px 20px rgba(0,0,0,0.4), 0 0 30px rgba(255, 106, 213, 0.7);
      }
      .p4 .planet-glow { background: radial-gradient(circle, rgba(255,106,213,0.6) 0%, transparent 70%); }
      .p4:hover .planet-sphere { box-shadow: inset -8px -8px 20px rgba(0,0,0,0.4), 0 0 60px rgba(255, 106, 213, 1); }
      .p4 .planet-label { --c: var(--glow-pink); }

      .p5 { width: 50px; height: 50px; }
      .p5 .planet-sphere {
        background: radial-gradient(circle at 30% 30%, #d0b0ff 0%, #9050e0 40%, #5020a0 70%, #301060 100%);
        box-shadow: inset -7px -7px 18px rgba(0,0,0,0.4), 0 0 25px rgba(170, 102, 255, 0.7);
      }
      .p5 .planet-glow { background: radial-gradient(circle, rgba(170,102,255,0.6) 0%, transparent 70%); }
      .p5:hover .planet-sphere { box-shadow: inset -7px -7px 18px rgba(0,0,0,0.4), 0 0 55px rgba(170, 102, 255, 1); }
      .p5 .planet-label { --c: var(--glow-purple); }

      .ui-top {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        padding: 20px 28px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        z-index: 200;
        pointer-events: none;
      }

      .ui-top > * { pointer-events: auto; }

      .logo h1 {
        font-size: 2.2rem;
        font-weight: 300;
        letter-spacing: 0.45em;
        text-transform: uppercase;
        background: linear-gradient(135deg, var(--glow-cyan), var(--glow-pink));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .logo p {
        font-size: 0.7rem;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: var(--muted);
        margin-top: 5px;
      }

      .balance {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 20px;
        background: rgba(5, 12, 30, 0.9);
        border: 1px solid rgba(255, 204, 102, 0.5);
        border-radius: 10px;
        backdrop-filter: blur(10px);
      }

      .balance-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--glow-gold);
        box-shadow: 0 0 12px var(--glow-gold);
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.3); }
      }

      .balance span {
        font-size: 0.95rem;
        letter-spacing: 0.1em;
        color: var(--glow-gold);
      }

      .ui-bottom {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 18px 28px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 200;
        background: linear-gradient(transparent, rgba(2, 5, 16, 0.95));
        pointer-events: none;
      }

      .ui-bottom > * { pointer-events: auto; }

      .help-btn {
        padding: 10px 18px;
        background: rgba(5, 12, 30, 0.9);
        border: 1px solid rgba(122, 130, 166, 0.4);
        border-radius: 8px;
        color: var(--muted);
        font-family: inherit;
        font-size: 0.72rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .help-btn:hover {
        border-color: var(--glow-cyan);
        color: var(--glow-cyan);
        box-shadow: 0 0 20px rgba(90, 216, 255, 0.3);
      }

      .legend {
        display: flex;
        gap: 22px;
        flex-wrap: wrap;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.68rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .legend-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }

      .legend-dot.cyan { background: var(--glow-cyan); box-shadow: 0 0 8px var(--glow-cyan); }
      .legend-dot.pink { background: var(--glow-pink); box-shadow: 0 0 8px var(--glow-pink); }
      .legend-dot.gold { background: var(--glow-gold); box-shadow: 0 0 8px var(--glow-gold); }
      .legend-dot.purple { background: var(--glow-purple); box-shadow: 0 0 8px var(--glow-purple); }
      .legend-dot.gray { background: #a09080; box-shadow: 0 0 8px rgba(160,144,128,0.6); }

      .click-hint {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, 280px);
        font-size: 0.7rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--muted);
        opacity: 0.7;
        z-index: 10;
        animation: hint-pulse 3s ease-in-out infinite;
      }

      @keyframes hint-pulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 0.9; }
      }

      @media (max-width: 1000px) {
        .solar-container { width: 700px; height: 700px; }
        .orbit-1 { width: 160px; height: 160px; }
        .orbit-2 { width: 270px; height: 270px; }
        .orbit-3 { width: 400px; height: 400px; }
        .orbit-4 { width: 540px; height: 540px; }
        .orbit-5 { width: 680px; height: 680px; }
        .po-1 { width: 160px; height: 160px; }
        .po-2 { width: 270px; height: 270px; }
        .po-3 { width: 400px; height: 400px; }
        .po-4 { width: 540px; height: 540px; }
        .po-5 { width: 680px; height: 680px; }
        .sun { width: 80px; height: 80px; }
        .p1 { width: 35px; height: 35px; }
        .p2 { width: 45px; height: 45px; }
        .p3 { width: 58px; height: 58px; }
        .p4 { width: 48px; height: 48px; }
        .p5 { width: 42px; height: 42px; }
        .click-hint { transform: translate(-50%, 220px); }
      }

      @media (max-width: 700px) {
        .solar-container { width: 550px; height: 550px; transform: translate(-50%, -50%) rotateX(70deg); }
        .orbit-1 { width: 120px; height: 120px; }
        .orbit-2 { width: 210px; height: 210px; }
        .orbit-3 { width: 310px; height: 310px; }
        .orbit-4 { width: 420px; height: 420px; }
        .orbit-5 { width: 530px; height: 530px; }
        .po-1 { width: 120px; height: 120px; }
        .po-2 { width: 210px; height: 210px; }
        .po-3 { width: 310px; height: 310px; }
        .po-4 { width: 420px; height: 420px; }
        .po-5 { width: 530px; height: 530px; }
        .sun { width: 65px; height: 65px; }
        .sun-text h2 { font-size: 0.55rem; }
        .sun-text span { font-size: 0.38rem; }
        .p1 { width: 28px; height: 28px; }
        .p2 { width: 36px; height: 36px; }
        .p3 { width: 48px; height: 48px; }
        .p4 { width: 38px; height: 38px; }
        .p5 { width: 34px; height: 34px; }
        .planet-label { display: none; }
        .logo h1 { font-size: 1.5rem; letter-spacing: 0.3em; }
        .logo p { font-size: 0.55rem; }
        .ui-top, .ui-bottom { padding: 14px 18px; }
        .legend { gap: 14px; }
        .legend-item { font-size: 0.55rem; }
        .click-hint { transform: translate(-50%, 180px); font-size: 0.6rem; }
      }

      @media (max-width: 500px) {
        .solar-container { width: 420px; height: 420px; }
        .orbit-1 { width: 90px; height: 90px; }
        .orbit-2 { width: 160px; height: 160px; }
        .orbit-3 { width: 240px; height: 240px; }
        .orbit-4 { width: 320px; height: 320px; }
        .orbit-5 { width: 400px; height: 400px; }
        .po-1 { width: 90px; height: 90px; }
        .po-2 { width: 160px; height: 160px; }
        .po-3 { width: 240px; height: 240px; }
        .po-4 { width: 320px; height: 320px; }
        .po-5 { width: 400px; height: 400px; }
        .sun { width: 50px; height: 50px; }
        .p1 { width: 22px; height: 22px; }
        .p2 { width: 28px; height: 28px; }
        .p3 { width: 38px; height: 38px; }
        .p4 { width: 30px; height: 30px; }
        .p5 { width: 26px; height: 26px; }
        .logo h1 { font-size: 1.2rem; }
        .balance { padding: 8px 14px; }
        .balance span { font-size: 0.8rem; }
        .click-hint { transform: translate(-50%, 140px); }
      }
    </style>
  </head>
  <body>
    <div class="space-bg"></div>

    <div class="stars">
      <div class="star" style="top:3%;left:6%;width:1px;height:1px;--d:3s"></div>
      <div class="star" style="top:7%;left:18%;width:2px;height:2px;--d:4s;--t:0.5s"></div>
      <div class="star" style="top:4%;left:32%;width:1px;height:1px;--d:3.5s;--t:1s"></div>
      <div class="star" style="top:10%;left:48%;width:1px;height:1px;--d:3s;--t:1.5s"></div>
      <div class="star" style="top:5%;left:65%;width:2px;height:2px;--d:4.5s;--t:0.3s"></div>
      <div class="star" style="top:8%;left:82%;width:1px;height:1px;--d:3s;--t:0.8s"></div>
      <div class="star" style="top:15%;left:10%;width:1px;height:1px;--d:3.5s;--t:2s"></div>
      <div class="star" style="top:18%;left:90%;width:2px;height:2px;--d:4s;--t:0.2s"></div>
      <div class="star" style="top:12%;left:55%;width:1px;height:1px;--d:3s;--t:1.2s"></div>
      <div class="star" style="top:22%;left:5%;width:1px;height:1px;--d:4s;--t:0.7s"></div>
      <div class="star" style="top:25%;left:95%;width:1px;height:1px;--d:3.5s;--t:1.8s"></div>
      <div class="star" style="top:78%;left:8%;width:1px;height:1px;--d:3s;--t:0.4s"></div>
      <div class="star" style="top:82%;left:92%;width:2px;height:2px;--d:5s"></div>
      <div class="star" style="top:88%;left:25%;width:1px;height:1px;--d:4s;--t:1s"></div>
      <div class="star" style="top:85%;left:60%;width:1px;height:1px;--d:3s;--t:0.6s"></div>
      <div class="star" style="top:90%;left:78%;width:2px;height:2px;--d:3.5s;--t:1.4s"></div>
      <div class="star" style="top:6%;left:40%;width:3px;height:3px;--d:5s;background:rgba(255,220,180,0.9)"></div>
      <div class="star" style="top:14%;left:75%;width:3px;height:3px;--d:4s;--t:1s;background:rgba(180,200,255,0.9)"></div>
    </div>

    <div class="solar-container">
      <div class="orbit orbit-1"></div>
      <div class="orbit orbit-2"></div>
      <div class="orbit orbit-3"></div>
      <div class="orbit orbit-4"></div>
      <div class="orbit orbit-5"></div>

      <div class="sun">
        <div class="sun-text">
          <h2>StarStruck</h2>
          <span>Hub</span>
        </div>
      </div>

      <div class="planet-orbit po-1">
        <a href="shop.html" class="planet p1">
          <div class="planet-glow"></div>
          <div class="planet-sphere"></div>
          <div class="planet-label">
            <div class="name">Shop</div>
            <div class="tier">Star Market</div>
          </div>
        </a>
      </div>

      <div class="planet-orbit po-2">
        <a href="world-signal.html" class="planet p2">
          <div class="planet-glow"></div>
          <div class="planet-sphere"></div>
          <div class="planet-label">
            <div class="name">Signal Market</div>
            <div class="tier">World 003</div>
          </div>
        </a>
      </div>

      <div class="planet-orbit po-3">
        <a href="world-glass.html" class="planet p3">
          <div class="planet-glow"></div>
          <div class="planet-sphere"></div>
          <div class="planet-label">
            <div class="name">Glass City</div>
            <div class="tier">World 001</div>
          </div>
        </a>
      </div>

      <div class="planet-orbit po-4">
        <a href="world-neon.html" class="planet p4">
          <div class="planet-glow"></div>
          <div class="planet-sphere"></div>
          <div class="planet-label">
            <div class="name">Neon Underpass</div>
            <div class="tier">World 002</div>
          </div>
        </a>
      </div>

      <div class="planet-orbit po-5">
        <a href="#" class="planet p5" id="guidePlanet">
          <div class="planet-glow"></div>
          <div class="planet-sphere"></div>
          <div class="planet-label">
            <div class="name">Guide</div>
            <div class="tier">Help Center</div>
          </div>
        </a>
      </div>
    </div>

    <p class="click-hint">Click a planet to enter its world</p>

    <div class="ui-top">
      <div class="logo">
        <h1>StarStruck</h1>
        <p>Portal System</p>
      </div>
      <div class="balance">
        <span class="balance-dot"></span>
        <span id="balanceValue">100.00 ★</span>
      </div>
    </div>

    <div class="ui-bottom">
      <button class="help-btn" id="helpBtn">? How It Works</button>
      <div class="legend">
        <div class="legend-item"><span class="legend-dot cyan"></span> Glass City</div>
        <div class="legend-item"><span class="legend-dot pink"></span> Neon</div>
        <div class="legend-item"><span class="legend-dot gold"></span> Signal</div>
        <div class="legend-item"><span class="legend-dot gray"></span> Shop</div>
        <div class="legend-item"><span class="legend-dot purple"></span> Guide</div>
      </div>
    </div>

    <aside class="tourbot" aria-label="StarStruck tour guide">
      <div class="tourbot-shell" id="tourbotShell">
        <div class="tourbot-top">
          <div class="tourbot-title">
            <div class="bot-avatar" aria-hidden="true">
              <div class="bot-antenna"></div>
              <div class="bot-face">
                <div class="bot-face-inner">
                  <div class="bot-eye left"></div>
                  <div class="bot-eye right"></div>
                  <div class="bot-smile"></div>
                </div>
              </div>
            </div>
            <div class="tourbot-meta">
              <div class="tourbot-name">TourBot</div>
              <div class="tourbot-sub">Dimensional guide</div>
            </div>
          </div>
          <div class="tourbot-actions">
            <button class="tourbot-iconbtn" type="button" id="tourbotToggle">▾</button>
            <button class="tourbot-iconbtn" type="button" id="tourbotReset">↺</button>
          </div>
        </div>
        <div class="tourbot-body">
          <div class="tourbot-log" id="tourbotLog" aria-live="polite"></div>
          <div class="tourbot-choices" id="tourbotChoices"></div>
        </div>
      </div>
    </aside>

    <script src="tourbot.js" defer></script>
    <script>
      const openTourbot = () => {
        const shell = document.getElementById("tourbotShell");
        if (shell) shell.parentElement.classList.remove("tourbot-collapsed");
      };

      document.getElementById("helpBtn").addEventListener("click", openTourbot);
      document.getElementById("guidePlanet").addEventListener("click", (e) => {
        e.preventDefault();
        openTourbot();
      });
    </script>
  </body>
</html>
