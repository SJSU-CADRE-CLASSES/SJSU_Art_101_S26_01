<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StarStruck // Portal Hub</title>
    <link rel="stylesheet" href="tourbot.css" />
    <style>
      :root {
        --void: #030818;
        --glow-cyan: #5ad8ff;
        --glow-pink: #ff6ad5;
        --glow-gold: #ffcc66;
        --glow-purple: #aa66ff;
        --text: #e8ecff;
        --muted: #7a82a6;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: "Courier New", Courier, monospace;
        color: var(--text);
        background: var(--void);
      }

      .space-bg {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(ellipse at 50% 40%, rgba(15, 25, 60, 0.9) 0%, transparent 50%),
          linear-gradient(180deg, #010308 0%, #040915 40%, #020510 100%);
        z-index: 0;
      }

      .stars-layer {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
      }

      .star {
        position: absolute;
        border-radius: 50%;
        background: #fff;
        animation: twinkle var(--dur, 3s) ease-in-out infinite;
        animation-delay: var(--delay, 0s);
      }

      @keyframes twinkle {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }

      .grid-bg {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background:
          linear-gradient(rgba(50, 80, 120, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(50, 80, 120, 0.03) 1px, transparent 1px);
        background-size: 80px 80px;
        transform: perspective(500px) rotateX(60deg);
        transform-origin: center 80%;
        opacity: 0.6;
      }

      .solar-wrapper {
        position: fixed;
        top: 45%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 5;
        perspective: 1000px;
      }

      .solar-system {
        position: relative;
        width: 160vmin;
        height: 160vmin;
        max-width: 1600px;
        max-height: 1600px;
        transform: rotateX(65deg) rotateZ(-15deg);
        transform-style: preserve-3d;
      }

      .orbit {
        position: absolute;
        top: 50%;
        left: 50%;
        border: 1px solid rgba(80, 120, 180, 0.25);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 20px rgba(80, 120, 180, 0.1);
      }

      .orbit-1 { width: 22%; height: 22%; }
      .orbit-2 { width: 36%; height: 36%; }
      .orbit-3 { width: 52%; height: 52%; }
      .orbit-4 { width: 70%; height: 70%; }
      .orbit-5 { width: 88%; height: 88%; }

      .center-sun {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotateX(-65deg) rotateZ(15deg);
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%,
          #fff 0%,
          #ffe866 10%,
          #ffcc00 30%,
          #ff9900 60%,
          #ff6600 85%,
          #cc3300 100%
        );
        box-shadow:
          0 0 80px rgba(255, 180, 0, 0.9),
          0 0 160px rgba(255, 120, 0, 0.6),
          0 0 280px rgba(255, 80, 0, 0.4),
          0 0 400px rgba(255, 60, 0, 0.2);
        animation: sun-pulse 4s ease-in-out infinite;
        z-index: 10;
      }

      @keyframes sun-pulse {
        0%, 100% { 
          box-shadow: 0 0 80px rgba(255, 180, 0, 0.9), 0 0 160px rgba(255, 120, 0, 0.6), 0 0 280px rgba(255, 80, 0, 0.4);
        }
        50% { 
          box-shadow: 0 0 100px rgba(255, 180, 0, 1), 0 0 200px rgba(255, 120, 0, 0.7), 0 0 350px rgba(255, 80, 0, 0.5);
        }
      }

      .sun-label {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        pointer-events: none;
      }

      .sun-title {
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #1a0500;
        text-shadow: 0 0 8px rgba(255, 255, 200, 0.9);
      }

      .sun-sub {
        font-size: 0.5rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #331100;
        margin-top: 2px;
      }

      .orbit-path {
        position: absolute;
        top: 50%;
        left: 50%;
        transform-origin: center;
        pointer-events: none;
      }

      .op-1 {
        width: 22%;
        height: 22%;
        transform: translate(-50%, -50%);
        animation: orbit-spin 25s linear infinite;
      }

      .op-2 {
        width: 36%;
        height: 36%;
        transform: translate(-50%, -50%);
        animation: orbit-spin 40s linear infinite reverse;
      }

      .op-3 {
        width: 52%;
        height: 52%;
        transform: translate(-50%, -50%);
        animation: orbit-spin 60s linear infinite;
      }

      .op-4 {
        width: 70%;
        height: 70%;
        transform: translate(-50%, -50%);
        animation: orbit-spin 85s linear infinite reverse;
      }

      .op-5 {
        width: 88%;
        height: 88%;
        transform: translate(-50%, -50%);
        animation: orbit-spin 110s linear infinite;
      }

      @keyframes orbit-spin {
        from { transform: translate(-50%, -50%) rotate(0deg); }
        to { transform: translate(-50%, -50%) rotate(360deg); }
      }

      .planet {
        position: absolute;
        border-radius: 50%;
        cursor: pointer;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        text-decoration: none;
        transform: rotateX(-65deg) rotateZ(15deg);
        transform-style: preserve-3d;
      }

      .planet:hover {
        transform: rotateX(-65deg) rotateZ(15deg) scale(1.2);
      }

      .planet-body {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        position: relative;
        overflow: hidden;
      }

      .planet-body::before {
        content: "";
        position: absolute;
        top: 10%;
        left: 15%;
        width: 35%;
        height: 25%;
        background: rgba(255, 255, 255, 0.5);
        border-radius: 50%;
        filter: blur(6px);
      }

      .planet-label {
        position: absolute;
        left: 110%;
        top: 50%;
        transform: translateY(-50%);
        white-space: nowrap;
        pointer-events: none;
        padding: 6px 12px;
        background: rgba(0, 5, 20, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 6px;
        backdrop-filter: blur(10px);
      }

      .planet-name {
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #fff;
      }

      .planet-tier {
        font-size: 0.5rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        margin-top: 2px;
      }

      .p1 {
        width: 50px;
        height: 50px;
        top: 0;
        left: 50%;
        margin-left: -25px;
        margin-top: -25px;
      }

      .p1 .planet-body {
        background: radial-gradient(circle at 30% 30%,
          #c8c8c8 0%,
          #888888 50%,
          #555555 100%
        );
        box-shadow: 0 0 20px rgba(150, 150, 150, 0.6), inset -8px -8px 20px rgba(0, 0, 0, 0.4);
      }

      .p1:hover .planet-body {
        box-shadow: 0 0 40px rgba(150, 150, 150, 0.9), 0 0 80px rgba(150, 150, 150, 0.4);
      }

      .p2 {
        width: 65px;
        height: 65px;
        top: 50%;
        right: 0;
        margin-right: -32px;
        margin-top: -32px;
      }

      .p2 .planet-body {
        background: radial-gradient(circle at 30% 30%,
          #ffe8c8 0%,
          #e6b060 50%,
          #cc8030 100%
        );
        box-shadow: 0 0 25px rgba(230, 180, 100, 0.7), inset -10px -10px 25px rgba(0, 0, 0, 0.3);
      }

      .p2:hover .planet-body {
        box-shadow: 0 0 50px rgba(230, 180, 100, 1), 0 0 100px rgba(230, 180, 100, 0.5);
      }

      .p3 {
        width: 75px;
        height: 75px;
        bottom: 15%;
        left: 8%;
        margin-left: -37px;
      }

      .p3 .planet-body {
        background: radial-gradient(circle at 30% 30%,
          #a8e6ff 0%,
          #5ad8ff 40%,
          #2090c0 70%,
          #105080 100%
        );
        box-shadow: 0 0 30px rgba(90, 216, 255, 0.8), inset -12px -12px 30px rgba(0, 0, 0, 0.3);
      }

      .p3:hover .planet-body {
        box-shadow: 0 0 60px rgba(90, 216, 255, 1), 0 0 120px rgba(90, 216, 255, 0.5);
      }

      .p3 .planet-label { border-color: rgba(90, 216, 255, 0.4); }

      .p4 {
        width: 60px;
        height: 60px;
        top: 25%;
        left: 5%;
        margin-left: -30px;
      }

      .p4 .planet-body {
        background: radial-gradient(circle at 30% 30%,
          #ffb8e6 0%,
          #ff6ad5 40%,
          #c03090 70%,
          #701860 100%
        );
        box-shadow: 0 0 25px rgba(255, 106, 213, 0.8), inset -10px -10px 25px rgba(0, 0, 0, 0.3);
      }

      .p4:hover .planet-body {
        box-shadow: 0 0 50px rgba(255, 106, 213, 1), 0 0 100px rgba(255, 106, 213, 0.5);
      }

      .p4 .planet-label { border-color: rgba(255, 106, 213, 0.4); }

      .p5 {
        width: 55px;
        height: 55px;
        bottom: 5%;
        right: 20%;
        margin-right: -27px;
      }

      .p5 .planet-body {
        background: radial-gradient(circle at 30% 30%,
          #d4b8ff 0%,
          #aa66ff 40%,
          #7030c0 70%,
          #401080 100%
        );
        box-shadow: 0 0 25px rgba(170, 102, 255, 0.8), inset -10px -10px 25px rgba(0, 0, 0, 0.3);
      }

      .p5:hover .planet-body {
        box-shadow: 0 0 50px rgba(170, 102, 255, 1), 0 0 100px rgba(170, 102, 255, 0.5);
      }

      .p5 .planet-label { border-color: rgba(170, 102, 255, 0.4); }

      .ui-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        padding: 20px 24px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        z-index: 20;
        pointer-events: none;
      }

      .ui-overlay > * {
        pointer-events: auto;
      }

      .logo-area {
        text-align: left;
      }

      .logo-title {
        font-size: 2rem;
        font-weight: 400;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        background: linear-gradient(135deg, var(--glow-cyan), var(--glow-pink));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: none;
      }

      .logo-sub {
        font-size: 0.7rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--muted);
        margin-top: 4px;
      }

      .balance-chip {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 20px;
        border: 1px solid rgba(255, 204, 102, 0.6);
        border-radius: 8px;
        background: rgba(0, 5, 20, 0.85);
        color: var(--glow-gold);
        font-size: 0.9rem;
        letter-spacing: 0.12em;
        box-shadow: 0 0 30px rgba(255, 204, 102, 0.15);
        backdrop-filter: blur(10px);
      }

      .balance-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--glow-gold);
        box-shadow: 0 0 12px var(--glow-gold);
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.3); opacity: 0.7; }
      }

      .bottom-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 16px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 20;
        background: linear-gradient(transparent, rgba(0, 5, 15, 0.9));
        pointer-events: none;
      }

      .bottom-bar > * {
        pointer-events: auto;
      }

      .help-btn {
        padding: 10px 18px;
        border: 1px solid rgba(122, 130, 166, 0.5);
        border-radius: 6px;
        background: rgba(5, 10, 30, 0.9);
        color: var(--muted);
        font-family: inherit;
        font-size: 0.72rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.2s ease;
        backdrop-filter: blur(10px);
      }

      .help-btn:hover {
        border-color: var(--glow-cyan);
        color: var(--glow-cyan);
        box-shadow: 0 0 25px rgba(90, 216, 255, 0.3);
      }

      .legend {
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.65rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .legend-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }

      .legend-dot.cyan { background: var(--glow-cyan); box-shadow: 0 0 10px var(--glow-cyan); }
      .legend-dot.pink { background: var(--glow-pink); box-shadow: 0 0 10px var(--glow-pink); }
      .legend-dot.gold { background: var(--glow-gold); box-shadow: 0 0 10px var(--glow-gold); }
      .legend-dot.purple { background: var(--glow-purple); box-shadow: 0 0 10px var(--glow-purple); }

      .scope-label {
        position: fixed;
        top: 20px;
        right: 140px;
        font-size: 0.6rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--muted);
        z-index: 20;
      }

      @media (max-width: 900px) {
        .solar-system {
          width: 140vmin;
          height: 140vmin;
        }

        .center-sun { width: 90px; height: 90px; }
        .sun-title { font-size: 0.7rem; }

        .p1 { width: 40px; height: 40px; margin-left: -20px; margin-top: -20px; }
        .p2 { width: 50px; height: 50px; margin-right: -25px; margin-top: -25px; }
        .p3 { width: 60px; height: 60px; margin-left: -30px; }
        .p4 { width: 48px; height: 48px; margin-left: -24px; }
        .p5 { width: 44px; height: 44px; margin-right: -22px; }

        .planet-label { display: none; }
        .logo-title { font-size: 1.5rem; }
        .legend { gap: 16px; }
      }

      @media (max-width: 600px) {
        .solar-system {
          width: 130vmin;
          height: 130vmin;
          transform: rotateX(60deg) rotateZ(-10deg);
        }

        .center-sun { width: 70px; height: 70px; }
        .sun-title { font-size: 0.6rem; }
        .sun-sub { display: none; }

        .p1 { width: 32px; height: 32px; }
        .p2 { width: 40px; height: 40px; }
        .p3 { width: 48px; height: 48px; }
        .p4 { width: 38px; height: 38px; }
        .p5 { width: 35px; height: 35px; }

        .ui-overlay { padding: 12px 16px; }
        .logo-title { font-size: 1.2rem; letter-spacing: 0.25em; }
        .logo-sub { font-size: 0.55rem; }
        .balance-chip { padding: 8px 14px; font-size: 0.8rem; }

        .bottom-bar { padding: 12px 16px; }
        .legend { gap: 12px; }
        .legend-item { font-size: 0.55rem; gap: 5px; }
        .legend-dot { width: 8px; height: 8px; }
      }
    </style>
  </head>
  <body>
    <div class="space-bg"></div>

    <div class="stars-layer">
      <div class="star" style="top: 3%; left: 5%; width: 1px; height: 1px; --dur: 3s;"></div>
      <div class="star" style="top: 8%; left: 15%; width: 2px; height: 2px; --dur: 4s; --delay: 0.5s;"></div>
      <div class="star" style="top: 5%; left: 28%; width: 1px; height: 1px; --dur: 3.5s; --delay: 1s;"></div>
      <div class="star" style="top: 12%; left: 42%; width: 1px; height: 1px; --dur: 3s; --delay: 1.5s;"></div>
      <div class="star" style="top: 6%; left: 58%; width: 2px; height: 2px; --dur: 4.5s; --delay: 0.3s;"></div>
      <div class="star" style="top: 10%; left: 72%; width: 1px; height: 1px; --dur: 3s; --delay: 0.8s;"></div>
      <div class="star" style="top: 4%; left: 88%; width: 2px; height: 2px; --dur: 3.5s; --delay: 2s;"></div>
      <div class="star" style="top: 18%; left: 8%; width: 1px; height: 1px; --dur: 4s; --delay: 0.2s;"></div>
      <div class="star" style="top: 22%; left: 92%; width: 1px; height: 1px; --dur: 3s; --delay: 1.2s;"></div>
      <div class="star" style="top: 15%; left: 35%; width: 2px; height: 2px; --dur: 4s; --delay: 0.7s;"></div>
      <div class="star" style="top: 20%; left: 65%; width: 1px; height: 1px; --dur: 3.5s; --delay: 1.8s;"></div>
      <div class="star" style="top: 25%; left: 3%; width: 1px; height: 1px; --dur: 3s; --delay: 0.4s;"></div>
      <div class="star" style="top: 30%; left: 95%; width: 2px; height: 2px; --dur: 5s;"></div>
      <div class="star" style="top: 75%; left: 5%; width: 1px; height: 1px; --dur: 4s; --delay: 1s;"></div>
      <div class="star" style="top: 80%; left: 92%; width: 2px; height: 2px; --dur: 3s; --delay: 0.6s;"></div>
      <div class="star" style="top: 85%; left: 20%; width: 1px; height: 1px; --dur: 3.5s; --delay: 1.4s;"></div>
      <div class="star" style="top: 90%; left: 50%; width: 1px; height: 1px; --dur: 4s; --delay: 0.9s;"></div>
      <div class="star" style="top: 88%; left: 75%; width: 2px; height: 2px; --dur: 3s; --delay: 1.1s;"></div>
      <div class="star" style="top: 7%; left: 50%; width: 3px; height: 3px; --dur: 5s; background: rgba(255, 220, 180, 0.9);"></div>
      <div class="star" style="top: 15%; left: 80%; width: 3px; height: 3px; --dur: 4s; --delay: 1s; background: rgba(180, 200, 255, 0.9);"></div>
    </div>

    <div class="grid-bg"></div>

    <div class="solar-wrapper">
      <div class="solar-system">
        <div class="orbit orbit-1"></div>
        <div class="orbit orbit-2"></div>
        <div class="orbit orbit-3"></div>
        <div class="orbit orbit-4"></div>
        <div class="orbit orbit-5"></div>

        <div class="center-sun">
          <div class="sun-label">
            <div class="sun-title">StarStruck</div>
            <div class="sun-sub">Hub</div>
          </div>
        </div>

        <!-- Mercury position - small inner planet -->
        <div class="orbit-path op-1">
          <a href="shop.html" class="planet p1">
            <div class="planet-body"></div>
            <div class="planet-label">
              <div class="planet-name">Shop</div>
              <div class="planet-tier">Star Market</div>
            </div>
          </a>
        </div>

        <!-- Venus position -->
        <div class="orbit-path op-2">
          <a href="world-signal.html" class="planet p2">
            <div class="planet-body"></div>
            <div class="planet-label">
              <div class="planet-name">Signal</div>
              <div class="planet-tier">World 003</div>
            </div>
          </a>
        </div>

        <!-- Earth position - main world -->
        <div class="orbit-path op-3">
          <a href="world-glass.html" class="planet p3">
            <div class="planet-body"></div>
            <div class="planet-label">
              <div class="planet-name">Glass City</div>
              <div class="planet-tier">World 001</div>
            </div>
          </a>
        </div>

        <!-- Mars position -->
        <div class="orbit-path op-4">
          <a href="world-neon.html" class="planet p4">
            <div class="planet-body"></div>
            <div class="planet-label">
              <div class="planet-name">Neon</div>
              <div class="planet-tier">World 002</div>
            </div>
          </a>
        </div>

        <!-- Outer planet -->
        <div class="orbit-path op-5">
          <a href="#" class="planet p5" id="helpPlanet">
            <div class="planet-body"></div>
            <div class="planet-label">
              <div class="planet-name">Guide</div>
              <div class="planet-tier">Help Center</div>
            </div>
          </a>
        </div>
      </div>
    </div>

    <div class="ui-overlay">
      <div class="logo-area">
        <h1 class="logo-title">StarStruck</h1>
        <p class="logo-sub">Portal System</p>
      </div>
      <div class="balance-chip">
        <span class="balance-dot"></span>
        <span id="balanceValue">100.00 ★</span>
      </div>
    </div>

    <div class="bottom-bar">
      <button class="help-btn" id="helpBtn">? How It Works</button>
      <div class="legend">
        <div class="legend-item"><span class="legend-dot cyan"></span> Glass City</div>
        <div class="legend-item"><span class="legend-dot pink"></span> Neon</div>
        <div class="legend-item"><span class="legend-dot gold"></span> Signal</div>
        <div class="legend-item"><span class="legend-dot purple"></span> Guide</div>
      </div>
    </div>

    <aside class="tourbot" aria-label="StarStruck tour guide">
      <div class="tourbot-shell" id="tourbotShell">
        <div class="tourbot-top">
          <div class="tourbot-title">
            <div class="bot-avatar" aria-hidden="true">
              <div class="bot-antenna"></div>
              <div class="bot-face">
                <div class="bot-face-inner">
                  <div class="bot-eye left"></div>
                  <div class="bot-eye right"></div>
                  <div class="bot-smile"></div>
                </div>
              </div>
            </div>
            <div class="tourbot-meta">
              <div class="tourbot-name">TourBot</div>
              <div class="tourbot-sub">Dimensional guide</div>
            </div>
          </div>
          <div class="tourbot-actions">
            <button class="tourbot-iconbtn" type="button" id="tourbotToggle">▾</button>
            <button class="tourbot-iconbtn" type="button" id="tourbotReset">↺</button>
          </div>
        </div>
        <div class="tourbot-body">
          <div class="tourbot-log" id="tourbotLog" aria-live="polite"></div>
          <div class="tourbot-choices" id="tourbotChoices"></div>
        </div>
      </div>
    </aside>

    <script src="tourbot.js" defer></script>
    <script>
      const openTourbot = () => {
        const shell = document.getElementById("tourbotShell");
        if (shell) shell.parentElement.classList.remove("tourbot-collapsed");
      };

      document.getElementById("helpBtn").addEventListener("click", openTourbot);
      document.getElementById("helpPlanet").addEventListener("click", (e) => {
        e.preventDefault();
        openTourbot();
      });
    </script>
  </body>
</html>
