<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triton Alliance // Access Code</title>
    <style>
        @font-face {
            font-family: "HybridFont";
            src: url("Hybrid_b.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: "ArcadeFont";
            src: url("arcade font/ARCADE_N.TTF") format("truetype");
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: "ArcadeFont";
            src: url("arcade font/ARCADE_I.TTF") format("truetype");
            font-weight: normal;
            font-style: italic;
        }
        @font-face {
            font-family: "ArcadeFont";
            src: url("arcade font/ARCADE_R.TTF") format("truetype");
            font-weight: bold;
            font-style: normal;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            background: radial-gradient(circle at top, #00151a 0, #000000 55%, #000000 100%);
            color: #00e0c8;
            font-family: "HybridFont", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(0, 224, 200, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 224, 200, 0.03) 1px, transparent 1px);
            background-size: 100% 3px, 3px 100%;
            mix-blend-mode: screen;
            opacity: 0.5;
            z-index: 0;
        }

        .aqua-caustics {
            position: fixed;
            inset: -20%;
            pointer-events: none;
            background:
                radial-gradient(circle at 10% 20%, rgba(0, 224, 200, 0.16), transparent 55%),
                radial-gradient(circle at 80% 30%, rgba(0, 160, 255, 0.18), transparent 60%),
                radial-gradient(circle at 30% 80%, rgba(0, 224, 200, 0.12), transparent 55%);
            mix-blend-mode: screen;
            opacity: 0.35;
            filter: blur(4px);
            animation: drift-caustics 26s linear infinite alternate;
            z-index: 0;
        }

        .sonar-rings {
            position: fixed;
            left: 50%;
            top: 60%;
            width: 40vmin;
            height: 40vmin;
            transform: translate(-50%, -50%);
            pointer-events: none;
            border-radius: 50%;
            box-shadow:
                0 0 0 0 rgba(0, 224, 200, 0.18),
                0 0 0 20px rgba(0, 224, 200, 0.12),
                0 0 0 40px rgba(0, 224, 200, 0.08);
            animation: sonar-pulse 18s ease-out infinite;
            z-index: 0;
        }

        .chrome-bar {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 32px;
            border-bottom: 1px solid rgba(0, 224, 200, 0.35);
            background: linear-gradient(90deg, rgba(0, 224, 200, 0.08), rgba(0, 0, 0, 0.9));
            box-shadow:
                0 0 12px rgba(0, 224, 200, 0.45),
                inset 0 -1px 0 rgba(0, 0, 0, 0.8);
        }
        .chrome-id {
            font-family: "ArcadeFont", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 7pt;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #66ffe6;
            text-shadow: 0 0 6px rgba(0, 224, 200, 0.9);
        }
        .chrome-status {
            font-family: "ArcadeFont", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 10pt;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: #00ffa6;
        }
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 999px;
            margin-right: 8px;
            background: radial-gradient(circle at 30% 30%, #ffffff, #00ffa6 45%, transparent 60%);
            box-shadow: 0 0 12px rgba(0, 255, 166, 0.85);
            animation: status-blink 1.2s ease-in-out infinite;
        }

        .nav-links {
            margin: 0 auto;
            display: flex;
            gap: 30px;
            justify-content: center;
            font-family: "ArcadeFont", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 18pt;
        }
        .nav-links a {
            text-decoration: none;
            font-weight: bold;
        }
        a {
            color: #00e0c8;
            text-shadow: 0 0 4px rgba(0, 224, 200, 0.7), 0 0 12px rgba(0, 224, 200, 0.5);
        }

        .page-shell {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px 32px;
        }
        .page-content {
            position: relative;
            width: min(960px, 100%);
            border-radius: 18px;
            padding: 32px 40px 40px;
            background:
                radial-gradient(circle at top left, rgba(0, 224, 200, 0.12), transparent 65%),
                radial-gradient(circle at bottom right, rgba(0, 160, 255, 0.12), transparent 60%),
                rgba(0, 0, 0, 0.9);
            box-shadow:
                0 0 40px rgba(0, 224, 200, 0.45),
                0 0 80px rgba(0, 80, 120, 0.65);
            border: 1px solid rgba(0, 224, 200, 0.5);
            outline: 1px solid rgba(0, 255, 230, 0.25);
            outline-offset: 6px;
        }
        .scan-line {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(
                90deg,
                transparent 0,
                rgba(0, 224, 200, 0.03) 44%,
                rgba(0, 224, 200, 0.4) 50%,
                rgba(0, 224, 200, 0.03) 56%,
                transparent 100%
            );
            mix-blend-mode: screen;
            opacity: 0.0;
            animation: data-scan 10s linear infinite;
        }

        .page-content-inner {
            position: relative;
            z-index: 1;
            max-width: 780px;
            margin: 0 auto;
        }

        h1 {
            font-family: "HybridFont", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 42pt;
            margin: 0 0 8px;
            text-align: left;
            text-shadow:
                0 0 10px rgba(0, 224, 200, 0.9),
                0 0 24px rgba(0, 224, 200, 0.8);
        }
        h2 {
            font-family: "ArcadeFont", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 18pt;
            margin: 0 0 20px;
            text-transform: uppercase;
            letter-spacing: 0.18em;
        }

        .code-panel {
            padding: 18px 22px 22px;
            border-radius: 12px;
            border: 1px solid rgba(0, 224, 200, 0.6);
            background: rgba(0, 18, 20, 0.9);
            box-shadow:
                0 0 18px rgba(0, 224, 200, 0.55),
                inset 0 0 16px rgba(0, 224, 200, 0.35);
            font-family: "ArcadeFont", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 11pt;
            line-height: 1.6;
        }

        .code-label {
            font-size: 10pt;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: #66ffe6;
            margin-bottom: 8px;
        }

        .puzzle-equation {
            margin: 10px 0 14px;
            font-size: 14pt;
            letter-spacing: 0.04em;
            opacity: 0.95;
        }

        .code-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-top: 10px;
        }

        .code-input {
            min-width: 240px;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(0, 224, 200, 0.7);
            background: rgba(0, 0, 0, 0.75);
            color: #00e0c8;
            font-family: "ArcadeFont", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 12pt;
            letter-spacing: 0.12em;
        }

        .btn {
            padding: 10px 16px;
            border-radius: 999px;
            border: 1px solid rgba(0, 224, 200, 0.7);
            background: linear-gradient(90deg, rgba(0, 224, 200, 0.16), rgba(0, 0, 0, 0.9));
            color: #00e0c8;
            font-family: "ArcadeFont", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 10pt;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            cursor: pointer;
        }
        .btn[disabled] {
            opacity: 0.45;
            cursor: default;
        }

        .status-line {
            margin-top: 10px;
            font-size: 10pt;
            letter-spacing: 0.08em;
            opacity: 0.95;
        }
        .status-line.error {
            color: #ff7f7f;
        }
        .status-line.ok {
            color: #66ffe6;
        }

        @keyframes drift-caustics {
            0% { transform: translate3d(-4%, -2%, 0) scale(1.1); }
            50% { transform: translate3d(3%, 2%, 0) scale(1.05); }
            100% { transform: translate3d(6%, -4%, 0) scale(1.15); }
        }

        @keyframes sonar-pulse {
            0% {
                transform: translate(-50%, -50%) scale(0.7);
                opacity: 0.25;
                box-shadow:
                    0 0 0 0 rgba(0, 224, 200, 0.22),
                    0 0 0 12px rgba(0, 224, 200, 0.15),
                    0 0 0 26px rgba(0, 224, 200, 0.08);
            }
            70% {
                transform: translate(-50%, -50%) scale(1.35);
                opacity: 0.02;
                box-shadow:
                    0 0 0 40px rgba(0, 224, 200, 0.0),
                    0 0 0 80px rgba(0, 224, 200, 0.0),
                    0 0 0 120px rgba(0, 224, 200, 0.0);
            }
            100% { opacity: 0; }
        }

        @keyframes data-scan {
            0% { opacity: 0; transform: translateX(-60%); }
            10% { opacity: 0.5; }
            40% { opacity: 0.3; }
            60% { opacity: 0.5; }
            90% { opacity: 0; transform: translateX(60%); }
            100% { opacity: 0; transform: translateX(60%); }
        }

        @keyframes status-blink {
            0%, 30% { opacity: 1; }
            45% { opacity: 0.15; }
            60% { opacity: 1; }
            75% { opacity: 0.15; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="aqua-caustics"></div>
    <div class="sonar-rings"></div>

    <header class="chrome-bar">
        <div class="chrome-id">TRITON ALLIANCE // ACCESS CODE</div>
        <div class="chrome-status"><span class="status-dot"></span>auth: awaiting code</div>
    </header>

    <main class="page-shell">
        <section class="page-content">
            <div class="scan-line"></div>
            <div class="page-content-inner">
                <h1>Access Code</h1>
                <h2>numerical authorization</h2>

                <div class="code-panel">
                    <div class="code-label">Compute & Enter Code</div>
                    <div id="attempts-meta" class="status-line">Attempts left: 3</div>
                    <div class="puzzle-equation" id="equation">
                        ...
                    </div>

                    <div class="code-controls">
                        <input
                            id="code-input"
                            class="code-input"
                            inputmode="numeric"
                            maxlength="4"
                            placeholder="4-digit code"
                            aria-label="Access code"
                        />
                        <button id="verify-btn" class="btn" type="button">verify</button>
                    </div>

                    <div class="status-line" id="status-line">
                        Hint: code is a direct result of the equation shown above.
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        (function () {
            const attemptsLeftMeta = document.getElementById("attempts-meta");
            const equationEl = document.getElementById("equation");
            const inputEl = document.getElementById("code-input");
            const verifyBtn = document.getElementById("verify-btn");
            const statusLine = document.getElementById("status-line");

            const MAX_ATTEMPTS = 3;
            const CODE_LEN = 4;
            let attemptsLeft = MAX_ATTEMPTS;
            let expectedCode = "";

            function randInt(min, maxInclusive) {
                return Math.floor(Math.random() * (maxInclusive - min + 1)) + min;
            }

            function generatePuzzle() {
                // Create a simple but non-trivial arithmetic puzzle:
                // expectedCode = (A × B) + C, formatted as 4 digits.
                let A, B, C, raw;
                for (let tries = 0; tries < 200; tries++) {
                    A = randInt(12, 79);
                    B = randInt(11, 31);
                    C = randInt(18, 91);
                    raw = A * B + C;
                    if (raw >= 1000 && raw <= 9999) break;
                }

                const code = String(raw).padStart(CODE_LEN, "0");
                expectedCode = code;

                equationEl.textContent = "Compute: (" + A + " × " + B + ") + " + C + "  =  ????";
                statusLine.className = "status-line";
                statusLine.textContent = "Enter the 4-digit result.";
                inputEl.value = "";
                inputEl.focus();
                verifyBtn.disabled = attemptsLeft <= 0;
            }

            function setStatus(text, variant) {
                statusLine.className = "status-line";
                if (variant === "error") statusLine.classList.add("error");
                if (variant === "ok") statusLine.classList.add("ok");
                statusLine.textContent = text;
            }

            function updateAttempts() {
                attemptsLeftMeta.textContent = "Attempts left: " + String(attemptsLeft);
            }

            function verify() {
                const entered = String(inputEl.value || "").trim();
                if (attemptsLeft <= 0) return;

                if (entered.length === 0) {
                    setStatus("Enter the access code first.", "error");
                    return;
                }

                const normalized = entered.replace(/\s+/g, "");
                if (normalized === expectedCode) {
                    setStatus("Access granted. Welcome aboard.", "ok");
                    try {
                        localStorage.setItem("tritonAccessCodeVerified", "1");
                    } catch (e) {
                        // ignore
                    }
                    verifyBtn.disabled = true;
                    setTimeout(() => {
                        window.location.href = "gate.html";
                    }, 900);
                } else {
                    attemptsLeft -= 1;
                    updateAttempts();
                    setStatus("Wrong code. Sonar gate remains locked.", "error");
                    if (attemptsLeft <= 0) {
                        verifyBtn.disabled = true;
                        setStatus("Terminal locked for this session.", "error");
                    } else {
                        // Keep the same puzzle so it feels like a single run.
                        inputEl.select();
                    }
                }
            }

            verifyBtn.addEventListener("click", verify);
            inputEl.addEventListener("keydown", (e) => {
                if (e.key === "Enter") verify();
            });

            updateAttempts();
            generatePuzzle();
        })();
    </script>
</body>
</html>
