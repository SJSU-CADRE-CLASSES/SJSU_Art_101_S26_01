<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Terminal - Prototype</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <!-- CRT interlacing overlay - covers entire viewport -->
    <div class="crt-overlay">
        <div class="crt-scanlines"></div>
        <div class="crt-interlace"></div>
        <div class="crt-noise"></div>
        <div class="crt-vignette"></div>
    </div>

    <div class="terminal-container">
        <header class="header">PERSONAL TERMINAL</header>

        <div class="main-content">
            <nav class="folders-panel">
                <div class="folders-title">FOLDERS</div>
                <div class="folder-buttons">
                    <button class="folder-btn active" data-tab="personal1">PERSONAL</button>
                    <button class="folder-btn" data-tab="shared">WARP DILATION</button>
                    <button class="folder-btn" data-tab="utility">SHIP EXTERIOR INTERFACE</button>
                    <button class="folder-btn" data-tab="personal2">CHAT-VOX</button>
                </div>
            </nav>

            <div class="content-panel">
                <div class="content-title" id="content-title">BIOSCAN</div>
                <div class="content-area">
                <!-- Tab content loaded from separate files: personal.html, warp-dilation.html, ship-exterior.html, chat.html -->
                <div id="personal1" class="tab-content active"><!-- loaded from personal.html --></div>
                <div id="shared" class="tab-content"><!-- loaded from warp-dilation.html --></div>
                <div id="utility" class="tab-content diagnostics-tab"><!-- loaded from ship-exterior.html --></div>
                <div id="personal2" class="tab-content chat-tab"><!-- loaded from chat.html --></div>
                </div>
            </div>
        </div>

        <footer class="footer">UP, DOWN: select folder | LEFT, RIGHT: scroll | q: return to dashboard</footer>
    </div>

    <script>
        const tabSources = {
            personal1: 'personal-fragment.html',
            shared: 'warp-dilation-fragment.html',
            utility: 'ship-exterior-fragment.html',
            personal2: 'chat-fragment.html'
        };

        Promise.all(
            Object.entries(tabSources).map(([id, url]) =>
                fetch(url).then(r => r.text()).then(html => ({ id, html }))
            )
        ).then(entries => {
            entries.forEach(({ id, html }) => {
                const el = document.getElementById(id);
                if (el) el.innerHTML = html;
            });
            initTerminal();
        }).catch(err => {
            console.error('Failed to load tab content:', err);
            initTerminal();
        });

        function initTerminal() {
            const contentTitleEl = document.getElementById('content-title');
            const buttons = Array.from(document.querySelectorAll('.folder-btn'));
            let selectedIndex = 0;

            // Open tab from URL hash on load (e.g. log-in.html#utility)
            const hash = window.location.hash.slice(1);
            if (hash) {
                const targetTab = document.getElementById(hash);
                const idx = buttons.findIndex(b => b.getAttribute('data-tab') === hash);
                if (targetTab && idx >= 0) {
                    document.querySelectorAll('.folder-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
                    buttons[idx].classList.add('active');
                    targetTab.classList.add('active');
                    contentTitleEl.textContent = buttons[idx].textContent.trim();
                    selectedIndex = idx;
                }
            }

            document.querySelectorAll('.folder-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.folder-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
                    btn.classList.add('active');
                    const tabId = btn.getAttribute('data-tab');
                    document.getElementById(tabId).classList.add('active');
                    contentTitleEl.textContent = btn.textContent.trim();
                });
            });

            const contentArea = document.querySelector('.content-area');
            document.addEventListener('keydown', (e) => {
                if (e.key === 'q' || e.key === 'Q') {
                    window.location.href = 'log-in.html';
                    return;
                }
                if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    selectedIndex = Math.max(0, selectedIndex - 1);
                    buttons[selectedIndex].click();
                    buttons[selectedIndex].focus();
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    selectedIndex = Math.min(buttons.length - 1, selectedIndex + 1);
                    buttons[selectedIndex].click();
                    buttons[selectedIndex].focus();
                } else if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    contentArea.scrollBy({ top: -80, behavior: 'smooth' });
                } else if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    contentArea.scrollBy({ top: 80, behavior: 'smooth' });
                }
            });

            buttons.forEach((btn, i) => btn.addEventListener('click', () => { selectedIndex = i; }));

            // Chat functionality (elements are in chat.html)
            const chatInput = document.getElementById('chat-input');
            const chatMessages = document.getElementById('chat-messages');
            const chatSend = document.getElementById('chat-send');
            if (chatInput && chatMessages && chatSend) {
                document.querySelectorAll('.char-key').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const char = btn.getAttribute('data-char');
                        const start = chatInput.selectionStart;
                        const end = chatInput.selectionEnd;
                        const val = chatInput.value;
                        chatInput.value = val.slice(0, start) + char + val.slice(end);
                        chatInput.selectionStart = chatInput.selectionEnd = start + 1;
                        chatInput.focus();
                    });
                });

                function sendMessage() {
                    const text = chatInput.value.trim();
                    if (!text) return;
                    const msg = document.createElement('div');
                    msg.className = 'chat-message';
                    msg.innerHTML = '<span class="sender">YOU:</span> ' + text.toUpperCase();
                    chatMessages.appendChild(msg);
                    chatInput.value = '';
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }

                chatSend.addEventListener('click', sendMessage);
                chatInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        sendMessage();
                    }
                });
            }
        }
    </script>
</body>
</html>
