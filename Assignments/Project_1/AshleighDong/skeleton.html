<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skeleton Tracking – Webcam + MediaPipe</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      font-family: system-ui, sans-serif;
      color: #eee;
    }
    .container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    #video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
      pointer-events: none;
      object-fit: cover;
    }
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      padding: 0.75rem 1rem;
      background: rgba(22, 33, 62, 0.85);
      backdrop-filter: blur(8px);
      font-size: 0.85rem;
    }
    .top-bar h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #00ff88;
      margin-right: 0.5rem;
    }
    .top-bar .controls label { display: flex; align-items: center; gap: 0.35rem; }
    .top-bar .controls input[type="file"] { max-width: 180px; }
    .top-bar select, .top-bar input[type="number"] {
      padding: 0.35rem 0.5rem;
      border-radius: 6px;
      background: rgba(255,255,255,0.1);
      color: #eee;
      border: 1px solid rgba(255,255,255,0.2);
    }
    #status {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.8);
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
    #status.error { color: #ff6b6b; }
    /* Custom camera prompt (shown before browser's permission dialog) */
    #cameraPrompt {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      padding: 2rem;
      text-align: center;
    }
    #cameraPrompt.hidden { display: none; }
    #cameraPrompt h2 {
      font-size: 1.5rem;
      color: #00ff88;
      margin-bottom: 0.75rem;
    }
    #cameraPrompt p {
      color: #aaa;
      max-width: 360px;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }
    #cameraPrompt button {
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: #00ff88;
      color: #1a1a2e;
      cursor: pointer;
      font-weight: 600;
    }
    #cameraPrompt button:hover { background: #00dd77; }
    #cameraPrompt .error { color: #ff6b6b; margin-top: 1rem; }
  </style>
</head>
<body>
  <div id="cameraPrompt">
    <h2>Skeleton tracking</h2>
    <p>This page reveals your true form.</p>
    <p>When you click below, your browser will ask for camera access, please allow it to start.</p>
    <button type="button" id="startCameraBtn">Start camera</button>
    <p id="cameraPromptError" class="error" style="display: none;"></p>
  </div>
  <div class="top-bar">
    <h1>Skeleton tracking</h1>
    <div class="controls">
      <label>
        Overlay image:
        <input type="file" id="overlayFile" accept="image/*">
      </label>
      <label>
        Pin to:
        <select id="anchorPoint">
          <option value="0">Nose</option>
          <option value="chest">Chest (center)</option>
          <option value="11">Left shoulder</option>
          <option value="12">Right shoulder</option>
          <option value="23">Left hip</option>
          <option value="24">Right hip</option>
        </select>
      </label>
      <label>
        Size (px):
        <input type="number" id="overlaySize" value="120" min="40" max="400" step="10">
      </label>
    </div>
  </div>
  <div class="container">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
  </div>
  <p id="status"></p>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1.1675465747/selfie_segmentation.js" crossorigin="anonymous"></script>
  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');

    let overlayImage = null;
    let lastSegmentationMask = null;
    let personCanvas = null;

    // Game-like background: interactable zones (normalized 0–1). Hand over zone = hover.
    const interactables = [
      { x: 0.2, y: 0.35, radius: 0.08, label: 'A', hover: false, color: '#ff6b6b' },
      { x: 0.5, y: 0.3, radius: 0.08, label: 'B', hover: false, color: '#4ecdc4' },
      { x: 0.8, y: 0.35, radius: 0.08, label: 'C', hover: false, color: '#ffe66d' },
      { x: 0.35, y: 0.65, radius: 0.07, label: '1', hover: false, color: '#95e1d3' },
      { x: 0.65, y: 0.65, radius: 0.07, label: '2', hover: false, color: '#f38181' },
    ];
    document.getElementById('overlayFile').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const img = new Image();
      img.onload = () => { overlayImage = img; };
      img.src = URL.createObjectURL(file);
    });

    function getAnchor(landmarks) {
      const val = document.getElementById('anchorPoint').value;
      const w = canvas.width, h = canvas.height;
      if (val === 'chest') {
        const l = landmarks[11], r = landmarks[12];
        if (!l || !r || (l.visibility != null && l.visibility < 0.5) || (r.visibility != null && r.visibility < 0.5)) return null;
        return { x: (l.x + r.x) / 2 * w, y: (l.y + r.y) / 2 * h };
      }
      const i = parseInt(val, 10);
      const lm = landmarks[i];
      if (!lm || (lm.visibility != null && lm.visibility < 0.5)) return null;
      return { x: lm.x * w, y: lm.y * h };
    }

    function drawOverlay(landmarks) {
      if (!overlayImage || !overlayImage.complete || overlayImage.naturalWidth === 0) return;
      const anchor = getAnchor(landmarks);
      if (!anchor) return;
      const size = Math.max(40, Math.min(400, Number(document.getElementById('overlaySize').value) || 120));
      const r = overlayImage.naturalWidth / overlayImage.naturalHeight;
      const w = r >= 1 ? size : size * r;
      const h = r >= 1 ? size / r : size;
      ctx.drawImage(overlayImage, anchor.x - w / 2, anchor.y - h / 2, w, h);
    }

    function drawGameBackground() {
      const w = canvas.width, h = canvas.height;
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, '#1a1a3e');
      g.addColorStop(0.6, '#16213e');
      g.addColorStop(1, '#0f3460');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = 'rgba(15, 52, 96, 0.9)';
      ctx.fillRect(0, h * 0.6, w, h * 0.5);
      ctx.fillStyle = '#0d2137';
      ctx.fillRect(0, h * 0.75, w, h * 0.3);
    }

    function drawPersonWithMask() {
      if (!personCanvas) return;
      const w = canvas.width, h = canvas.height;
      if (lastSegmentationMask) {
        const pctx = personCanvas.getContext('2d');
        pctx.drawImage(lastSegmentationMask, 0, 0, personCanvas.width, personCanvas.height);
        const imgData = pctx.getImageData(0, 0, personCanvas.width, personCanvas.height);
        const d = imgData.data;
        for (let i = 0; i < d.length; i += 4) d[i + 3] = (d[i] + d[i + 1] + d[i + 2]) / 3;
        pctx.putImageData(imgData, 0, 0);
        pctx.globalCompositeOperation = 'source-in';
        pctx.drawImage(video, 0, 0);
        pctx.globalCompositeOperation = 'source-over';
        ctx.drawImage(personCanvas, 0, 0);
      } else {
        // No mask yet: draw video inside a center viewport so game background and circles stay visible
        ctx.save();
        ctx.beginPath();
        const cx = w / 2, cy = h / 2, rw = w * 0.45, rh = h * 0.5;
        ctx.ellipse(cx, cy, rw, rh, 0, 0, 2 * Math.PI);
        ctx.clip();
        ctx.drawImage(video, 0, 0, w, h);
        ctx.restore();
      }
    }

    function updateInteractables(landmarks) {
      const leftWrist = landmarks[15];
      const rightWrist = landmarks[16];
      const points = [];
      if (leftWrist && (leftWrist.visibility == null || leftWrist.visibility > 0.5)) points.push({ x: leftWrist.x, y: leftWrist.y });
      if (rightWrist && (rightWrist.visibility == null || rightWrist.visibility > 0.5)) points.push({ x: rightWrist.x, y: rightWrist.y });
      for (const zone of interactables) {
        zone.hover = false;
        for (const p of points) {
          const dx = p.x - zone.x, dy = p.y - zone.y;
          if (dx * dx + dy * dy <= zone.radius * zone.radius) {
            zone.hover = true;
            break;
          }
        }
      }
    }

    function drawInteractables(landmarks) {
      const w = canvas.width, h = canvas.height;
      for (const z of interactables) {
        const x = z.x * w, y = z.y * h, r = z.radius * Math.min(w, h);
        ctx.save();
        ctx.fillStyle = z.hover ? '#fff' : z.color;
        ctx.strokeStyle = z.hover ? '#00ff88' : 'rgba(255,255,255,0.6)';
        ctx.lineWidth = z.hover ? 4 : 2;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, 2 * Math.PI);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#1a1a2e';
        ctx.font = `bold ${r * 0.8}px system-ui`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(z.label, x, y);
        ctx.restore();
      }
    }

    function resizeCanvas() {
      const w = video.videoWidth, h = video.videoHeight;
      canvas.width = w;
      canvas.height = h;
      personCanvas = document.createElement('canvas');
      personCanvas.width = w;
      personCanvas.height = h;
    }

    async function startCameraAndTracking() {
      const promptEl = document.getElementById('cameraPrompt');
      const promptError = document.getElementById('cameraPromptError');
      const btn = document.getElementById('startCameraBtn');
      btn.disabled = true;
      btn.textContent = 'Requesting access…';
      promptError.style.display = 'none';

      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 1280, height: 720, facingMode: 'user' },
        });
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Start camera';
        promptError.textContent = err.message || 'Camera access denied. Use HTTPS or localhost and allow camera in browser settings.';
        promptError.style.display = 'block';
        return;
      }

      promptEl.classList.add('hidden');
      btn.disabled = false;
      btn.textContent = 'Start camera';

      video.srcObject = stream;
      video.addEventListener('loadedmetadata', resizeCanvas);
      await video.play();
      resizeCanvas();
      statusEl.textContent = 'Move your hand over the circles to interact.';

      const pose = new Pose({
        locateFile: (file) =>
          `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`,
      });

      pose.setOptions({
        modelComplexity: 1,
        smoothLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5,
      });

      let segmenter = null;
      const segBase = 'https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1.1675465747';
      if (typeof window.SelfieSegmentation !== 'undefined') {
        try {
          segmenter = new window.SelfieSegmentation({
            locateFile: (file) => `${segBase}/${file}`,
          });
          segmenter.setOptions({ modelSelection: 0 });
          segmenter.onResults((results) => {
            if (results.segmentationMask) lastSegmentationMask = results.segmentationMask;
          });
        } catch (e) {
          console.warn('Selfie segmentation init failed', e);
        }
      }

      pose.onResults((results) => {
        const landmarks = results.poseLandmarks;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawGameBackground();
        drawPersonWithMask();
        if (landmarks) {
          updateInteractables(landmarks);
          drawInteractables(landmarks);
          drawOverlay(landmarks);
        }
      });

      async function detect() {
        if (video.readyState < 2) {
          requestAnimationFrame(detect);
          return;
        }
        const sends = [pose.send({ image: video })];
        if (segmenter) sends.push(segmenter.send({ image: video }));
        await Promise.all(sends);
        requestAnimationFrame(detect);
      }
      detect();
    }

    document.getElementById('startCameraBtn').addEventListener('click', startCameraAndTracking);
  </script>
</body>
</html>
