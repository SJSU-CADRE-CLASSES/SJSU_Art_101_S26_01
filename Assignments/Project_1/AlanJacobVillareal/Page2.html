<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page 2 - Alan Jacob Villareal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #b8e0b8;
            font-family: 'Press Start 2P', cursive;
            color: #00ff88;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }

        /* CRT scanlines overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.15) 2px,
                rgba(0, 0, 0, 0.15) 4px
            );
            pointer-events: none;
            z-index: 10;
        }

        h1 {
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 1.5rem;
            color: #ff00aa;
            text-shadow: 0 0 10px #ff00aa, 0 0 20px #ff00aa;
            line-height: 1.8;
        }

        .subtitle {
            font-size: 0.5rem;
            color: #00ff88;
            text-align: center;
            margin-bottom: 2rem;
            opacity: 0.9;
        }

        .blink {
            font-size: 0.6rem;
            color: #ffff00;
            text-align: center;
            margin: 1.5rem 0;
            animation: blink 1s step-end infinite;
            text-shadow: 0 0 8px #ffff00;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .stats {
            font-size: 0.45rem;
            color: #00ccff;
            margin-top: 1.5rem;
            line-height: 2.2;
        }

        .stats span {
            color: #ffff00;
        }

        .pixel-art {
            margin: 1.5rem auto;
            font-size: 2rem;
            line-height: 1.2;
            letter-spacing: 0.2rem;
            text-align: center;
            color: #ff00aa;
        }

        .footer {
            font-size: 0.35rem;
            color: #666;
            margin-top: 2rem;
            text-align: center;
        }

        /* Chibi image bottom-left, swaps on hover */
        .chibi-corner {
            position: fixed;
            bottom: 0;
            left: 0;
            z-index: 20;
            width: 120px;
            height: 120px;
            cursor: pointer;
        }
        .chibi-corner img {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: opacity 0.2s ease;
        }
        .chibi-corner img.chibi-default {
            opacity: 1;
        }
        .chibi-corner img.chibi-hover {
            opacity: 0;
        }
        .chibi-corner:hover img.chibi-default {
            opacity: 0;
        }
        .chibi-corner:hover img.chibi-hover,
        .chibi-corner.chibi-tour img.chibi-hover {
            opacity: 1;
        }
        .chibi-corner.chibi-tour img.chibi-default {
            opacity: 0;
        }
        .chibi-corner.chibi-tour {
            animation: chibi-corner-tour 6s ease-in-out forwards;
            pointer-events: none;
        }
        @keyframes chibi-corner-tour {
            0%   { transform: translate(0, 0); }
            25%  { transform: translate(0, calc(-100vh + 100%)); }
            50%  { transform: translate(calc(100vw - 100%), calc(-100vh + 100%)); }
            75%  { transform: translate(calc(100vw - 100%), 0); }
            100% { transform: translate(0, 0); }
        }

        /* Screensaver image container */
        .screensaver-wrap {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }
        .screensaver-wrap img {
            position: absolute;
            width: 120px;
            height: 120px;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="screensaver-wrap" id="screensaver-wrap">
        <img src="arknightsicon.png" alt="Arknights" id="ss-0">
        <img src="HSR_App.png" alt="Honkai Star Rail" id="ss-1">
        <img src="uma_icon.png" alt="Uma Musume" id="ss-2">
        <img src="robloxlogo.png" alt="Roblox" id="ss-3">
        <img src="ina11title.jpg" alt="Ina" id="ss-4">
    </div>
    <div class="chibi-corner" id="chibi-corner" title="Click to run around the corners">
        <img class="chibi-default" src="Twin_Turbo_Chibi1.png" alt="Twin Turbo Chibi">
        <img class="chibi-hover" src="Twin_Turbo_Chibi2.png" alt="Twin Turbo Chibi (hover)">
    </div>
    <script>
        (function() {
            var el = document.getElementById('chibi-corner');
            if (!el) return;
            el.addEventListener('click', function() {
                el.classList.remove('chibi-tour');
                el.offsetHeight;
                el.classList.add('chibi-tour');
            });
            el.addEventListener('animationend', function() {
                el.classList.remove('chibi-tour');
            });
        })();

        (function() {
            var wrap = document.getElementById('screensaver-wrap');
            if (!wrap) return;
            var imgs = wrap.querySelectorAll('img');
            var W = 120;
            var H = 120;
            var speedMin = 1.5;
            var speedMax = 3;
            var items = [];
            function rand(min, max) {
                return min + Math.random() * (max - min);
            }
            function randSpeed() {
                var s = rand(speedMin, speedMax);
                return Math.random() < 0.5 ? -s : s;
            }
            function init() {
                var vw = window.innerWidth;
                var vh = window.innerHeight;
                var maxX = Math.max(0, vw - W);
                var maxY = Math.max(0, vh - H);
                items = [];
                for (var i = 0; i < imgs.length; i++) {
                    var dx = randSpeed();
                    var dy = randSpeed();
                    if (dx === 0) dx = speedMin;
                    if (dy === 0) dy = speedMin;
                    items.push({
                        el: imgs[i],
                        x: rand(0, maxX),
                        y: rand(0, maxY),
                        dx: dx,
                        dy: dy
                    });
                }
            }
            function tick() {
                var vw = window.innerWidth;
                var vh = window.innerHeight;
                var maxX = Math.max(0, vw - W);
                var maxY = Math.max(0, vh - H);
                for (var i = 0; i < items.length; i++) {
                    var it = items[i];
                    it.x += it.dx;
                    it.y += it.dy;
                    if (it.x <= 0) { it.x = 0; it.dx = -it.dx; }
                    if (it.x >= maxX) { it.x = maxX; it.dx = -it.dx; }
                    if (it.y <= 0) { it.y = 0; it.dy = -it.dy; }
                    if (it.y >= maxY) { it.y = maxY; it.dy = -it.dy; }
                    it.el.style.left = it.x + 'px';
                    it.el.style.top = it.y + 'px';
                }
                requestAnimationFrame(tick);
            }
            init();
            window.addEventListener('resize', init);
            requestAnimationFrame(tick);
        })();
    </script>
</body>
</html>
