<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        font-family: "Press Start 2P", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: linear-gradient(to bottom, #ffffff, #000000);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        overflow: hidden;
      }

      .content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        text-align: center;
      }

      .number {
        font-size: clamp(3rem, 12vw, 6rem);
        letter-spacing: 0.1em;
        text-shadow: 0 4px 0 rgba(0, 0, 0, 0.6);
        opacity: 0;
        animation: fadeInNumber 3s ease-out forwards;
      }

      .subtitle {
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        max-width: 30rem;
        opacity: 0;
        animation: fadeInSubtitle 3s ease-out forwards;
        animation-delay: 0.6s;
      }

      @keyframes fadeInNumber {
        0% {
          opacity: 0;
          transform: translateY(12px);
        }
        60% {
          opacity: 1;
          transform: translateY(0);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeInSubtitle {
        0% {
          opacity: 0;
          transform: translateY(8px);
        }
        60% {
          opacity: 1;
          transform: translateY(0);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .bubble-link {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.7rem 1.4rem;
        margin-top: 0.5rem;
        border-radius: 999px;
        background-color: #ffffff;
        color: #000000;
        font-size: 0.6rem;
        letter-spacing: 0.08em;
        text-decoration: none;
        box-shadow: 0 0 0 3px #ffffff, 0 0 0 6px #000000;
        image-rendering: pixelated;
        cursor: pointer;
        opacity: 0;
        animation: fadeInSubtitle 3s ease-out forwards;
        animation-delay: 1.1s;
        transition: transform 0.1s steps(2, end), box-shadow 0.1s steps(2, end),
          background-color 0.1s steps(2, end), color 0.1s steps(2, end);
      }

      .bubble-link::after {
        content: "";
        position: absolute;
        bottom: -8px;
        right: 18px;
        width: 14px;
        height: 14px;
        background-color: #ffffff;
        border-radius: 999px;
        box-shadow: 0 0 0 3px #ffffff, 0 0 0 6px #000000;
      }

      .bubble-link:hover {
        background-color: #000000;
        color: #ffffff;
        transform: translate(-2px, -2px);
        box-shadow: 0 0 0 3px #000000, 0 0 0 6px #ffffff,
          4px 4px 0 rgba(0, 0, 0, 0.8);
      }

      .bubble-link:active {
        background-color: #000000;
        color: #ffffff;
        transform: translate(1px, 1px);
        box-shadow: 0 0 0 3px #000000, 0 0 0 6px #ffffff,
          1px 1px 0 rgba(0, 0, 0, 0.9);
      }

      .back-button {
        position: fixed;
        right: 1.5rem;
        bottom: 1.5rem;
        padding: 0.5rem 1.4rem;
        border-radius: 0;
        border: 3px solid #000000;
        background-color: #ffffff;
        color: #000000;
        font-size: 0.55rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 0 0 0 3px #ffffff, 0 0 0 6px #000000;
        image-rendering: pixelated;
        text-decoration: none;
        transition: transform 0.1s steps(2, end), box-shadow 0.1s steps(2, end),
          background-color 0.1s steps(2, end), color 0.1s steps(2, end);
      }

      .back-button:hover {
        background-color: #000000;
        color: #ffffff;
        transform: translate(-2px, -2px);
        box-shadow: 0 0 0 3px #000000, 0 0 0 6px #ffffff,
          4px 4px 0 rgba(0, 0, 0, 0.8);
      }

      .back-button:active {
        background-color: #000000;
        color: #ffffff;
        transform: translate(1px, 1px);
        box-shadow: 0 0 0 3px #000000, 0 0 0 6px #ffffff,
          1px 1px 0 rgba(0, 0, 0, 0.9);
      }
    </style>
  </head>
  <body>
    <div class="content">
      <div class="number">36,016</div>
      <p class="subtitle">Minutes of listening to music in the last year...</p>
      <a href="thoughts.html" class="bubble-link">thoughts</a>
    </div>
    <a href="quadrants.html" class="back-button">back</a>
    <script>
      (function () {
        let audioCtx;
        function playClick() {
          try {
            audioCtx =
              audioCtx ||
              new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "square";
            osc.frequency.value = 850;
            gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(
              0.001,
              audioCtx.currentTime + 0.08
            );
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.09);
          } catch (e) {}
        }

        document.addEventListener("click", function (e) {
          const target = e.target.closest("a, button");
          if (target) {
            playClick();
          }
        });
      })();
    </script>
  </body>
</html>
