<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calm</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        font-family: "Press Start 2P", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #020a1f;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        position: relative;
        overflow: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: -20%;
        z-index: 0;
        background:
          radial-gradient(circle at 15% 25%, rgba(176, 243, 255, 0.55), rgba(0, 0, 0, 0) 55%),
          radial-gradient(circle at 80% 70%, rgba(47, 111, 255, 0.45), rgba(0, 0, 0, 0) 60%),
          linear-gradient(135deg, rgba(2, 10, 31, 0.9), rgba(0, 22, 60, 0.9));
        background-size: 140% 140%;
        filter: blur(10px) saturate(1.05);
        animation: calmDrift 18s ease-in-out infinite alternate;
      }

      @keyframes calmDrift {
        0% {
          transform: translate(-2%, -2%);
          background-position: 0% 0%;
        }
        100% {
          transform: translate(2%, 2%);
          background-position: 100% 100%;
        }
      }

      .box {
        width: min(90vw, 600px);
        max-width: 600px;
        padding: 1.5rem;
        background-color: rgba(0, 0, 16, 0.85);
        border: 3px solid #000000;
        box-shadow: 0 0 0 3px #ffffff, 0 0 0 6px #000000;
        position: relative;
        z-index: 1;
      }

      .textarea {
        width: 100%;
        height: 180px;
        padding: 0.75rem;
        border-radius: 0;
        border: 3px solid #ffffff;
        background-color: #000814;
        color: #ffffff;
        font-family: "Press Start 2P", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        font-size: 0.6rem;
        letter-spacing: 0.06em;
        resize: none;
      }

      .textarea::placeholder {
        color: #a9c4ff;
      }

      audio {
        display: none;
      }

      .text-content {
        width: 100%;
        padding: 1.5rem;
        border-radius: 0;
        border: 3px solid #ffffff;
        background-color: transparent;
        color: #ffffff;
        font-family: "Press Start 2P", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        font-size: 0.85rem;
        letter-spacing: 0.06em;
        line-height: 1.8;
        text-align: center;
      }

      .volume-control {
        position: fixed;
        right: 1.5rem;
        top: 1.5rem;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        z-index: 3;
        font-family: "Press Start 2P", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        font-size: 0.5rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .volume-label {
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.7);
      }

      .volume-slider {
        -webkit-appearance: none;
        appearance: none;
        width: 90px;
        height: 6px;
        background: rgba(255, 255, 255, 0.25);
        border-radius: 0;
        border: 2px solid #000000;
        box-shadow: 0 0 0 2px #ffffff;
        cursor: pointer;
      }

      .volume-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 10px;
        height: 16px;
        background: #ffffff;
        border: 2px solid #000000;
        box-shadow: 0 0 0 2px #ffffff;
      }

      .volume-slider::-moz-range-thumb {
        width: 10px;
        height: 16px;
        background: #ffffff;
        border: 2px solid #000000;
        box-shadow: 0 0 0 2px #ffffff;
      }

      .back-button {
        position: fixed;
        right: 1.5rem;
        bottom: 1.5rem;
        padding: 0.5rem 1.4rem;
        border-radius: 0;
        border: 3px solid #000000;
        background-color: #ffffff;
        color: #000000;
        font-family: "Press Start 2P", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        font-size: 0.55rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 0 0 0 3px #ffffff, 0 0 0 6px #000000;
        image-rendering: pixelated;
        text-decoration: none;
        z-index: 2;
        transition: transform 0.1s steps(2, end), box-shadow 0.1s steps(2, end),
          background-color 0.1s steps(2, end), color 0.1s steps(2, end);
      }

      .back-button:hover {
        background-color: #000000;
        color: #ffffff;
        transform: translate(-2px, -2px);
        box-shadow: 0 0 0 3px #000000, 0 0 0 6px #ffffff,
          4px 4px 0 rgba(0, 0, 0, 0.8);
      }

      .back-button:active {
        background-color: #000000;
        color: #ffffff;
        transform: translate(1px, 1px);
        box-shadow: 0 0 0 3px #000000, 0 0 0 6px #ffffff,
          1px 1px 0 rgba(0, 0, 0, 0.9);
      }
    </style>
  </head>
  <body>
    <audio autoplay loop>
      <source src="Slide.mp3" type="audio/mpeg" />
    </audio>
    <div class="volume-control">
      <span class="volume-label">vol</span>
      <input
        id="volumeSlider"
        class="volume-slider"
        type="range"
        min="0"
        max="100"
        value="100"
      />
    </div>

    <div class="box">
      <div class="text-content">
        This is what gets me through most of my days, being something I can put
        on in the background while I go about my day and just puts me in a good
        mood, also helps me to be more observant of my surroundings and the
        quiteness of the world.
      </div>
    </div>

    <a href="quadrants.html" class="back-button">back</a>
    <script>
      (function () {
        const audio = document.querySelector("audio");
        const slider = document.getElementById("volumeSlider");
        if (audio && slider) {
          slider.value = String(audio.volume * 100);
          slider.addEventListener("input", function () {
            audio.volume = Number(slider.value) / 100;
          });
        }
      })();

      (function () {
        let audioCtx;
        function playClick() {
          try {
            audioCtx =
              audioCtx ||
              new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "square";
            osc.frequency.value = 850;
            gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(
              0.001,
              audioCtx.currentTime + 0.08
            );
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.09);
          } catch (e) {}
        }

        document.addEventListener("click", function (e) {
          const target = e.target.closest("a, button");
          if (target) {
            playClick();
          }
        });
      })();
    </script>
  </body>
</html>
