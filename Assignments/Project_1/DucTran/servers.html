<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Servers — Duc Tran Data Self Portrait</title>
  <style>
  *{box-sizing:border-box}
  body{font-family:"Courier New",Consolas,monospace;margin:0;background:#1a1a1a;color:#e0e0e0;line-height:1.6;min-height:100vh;font-size:14px}
  .stripe{height:6px;background:repeating-linear-gradient(90deg,#c00 0,#c00 8px,#000 8px,#000 16px)}
  .wrap{max-width:52rem;margin:0 auto;padding:1.5rem 1rem}
  .logo{text-align:center;padding:1rem 0;border-bottom:2px solid #c00;margin-bottom:1.5rem}
  .logo h1{margin:0;font-size:1.4rem;font-weight:700;color:#c00;letter-spacing:.1em;text-transform:uppercase}
  .logo p{margin:.35rem 0 0;font-size:.85rem;color:#666}
  .nav-list{list-style:none;padding:0;margin:0 0 1.5rem 0;display:flex;flex-wrap:wrap;gap:.5rem 1rem}
  .nav-list a{color:#e0e0e0;text-decoration:none}
  .nav-list a:hover{color:#c00}
  .nav-list .active{color:#c00}
  .card{background:#222;border:1px solid #333;padding:1.25rem;margin-bottom:1rem}
  .card h2{font-size:.95rem;color:#c00;margin:0 0 .75rem 0;text-transform:uppercase;letter-spacing:.06em}
  .card p{margin:0 0 1rem 0;color:#888}
  .bar-wrap{margin-bottom:.75rem}
  .bar-label{display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:.25rem;color:#888}
  .bar{height:1.25rem;background:#333;overflow:hidden}
  .bar-fill{height:100%;background:#c00;min-width:4px}
  footer{margin-top:2rem;padding-top:1rem;border-top:2px solid #c00;font-size:.85rem;color:#666}
  </style>
</head>
<body>
  <div class="stripe"></div>
  <div class="wrap">
    <header class="logo">
      <h1>Data Self Portrait</h1>
      <p>Servers · Where my messages go</p>
    </header>
    <ul class="nav-list">
      <li><a href="index.html">Home</a></li>
      <li><a href="channel-about-myself.html">About Myself</a></li>
      <li><a href="activity.html">Activity</a></li>
      <li><a href="servers.html" class="active">Servers</a></li>
      <li><a href="words.html">Words</a></li>
      <li><a href="about.html">How I got my data</a></li>
    </ul>
    <main>
      <p style="margin:0 0 1.5rem 0;color:#888;font-size:.9rem">Message count per server (from my Discord export).</p>
      <section class="card">
        <h2>Where I spend my messages</h2>
        <div id="chart-servers"></div>
      </section>
    </main>
    <footer>SJSU Art 101 S26 — Project 1</footer>
  </div>
  <div class="stripe"></div>
  <script>
  var discordPortrait = {
    messagesByMonth: [], messagesByDayOfWeek: [],
    servers: [{ name: "SJSU Art 101", messageCount: 420 }, { name: "Gaming Squad", messageCount: 890 }, { name: "Music & Films", messageCount: 210 }, { name: "Study Group", messageCount: 340 }, { name: "Friends", messageCount: 650 }],
    topWords: [], totalMessages: 2240, totalServers: 5, activeSince: "2024-08"
  };
  </script>
  <script>
    (function () {
      if (typeof discordPortrait === "undefined") {
        document.getElementById("chart-servers").innerHTML = "<p style='color:#888'>Data not loaded.</p>";
        return;
      }
      function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
      var servers = discordPortrait.servers || [];
      var maxServer = servers.length ? Math.max.apply(null, servers.map(function(d) { return d.messageCount; })) : 0;
      maxServer = maxServer || 1;
      document.getElementById("chart-servers").innerHTML = servers.map(function(d) {
        var pct = (d.messageCount / maxServer * 100);
        return "<div class=\"bar-wrap\"><div class=\"bar-label\"><span>" + esc(d.name) + "</span><span>" + (d.messageCount.toLocaleString ? d.messageCount.toLocaleString() : d.messageCount) + "</span></div><div class=\"bar\"><div class=\"bar-fill\" style=\"width:" + pct + "%\"></div></div></div>";
      }).join("");
    })();
  </script>
</body>
</html>
