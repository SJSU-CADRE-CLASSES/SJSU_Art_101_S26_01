<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" width="224" height="224" style="image-rendering:pixelated;image-rendering:crisp-edges">
  <title>Duc Tran — pixel portrait (face)</title>
  <!-- Simple background -->
  <rect x="0" y="0" width="112" height="112" fill="#2b2d31"/>
  <!-- Hair -->
  <rect x="16" y="8" width="80" height="24" fill="#1a1a1a"/>
  <rect x="8" y="32" width="20" height="20" fill="#1a1a1a"/>
  <rect x="84" y="32" width="20" height="20" fill="#1a1a1a"/>
  <!-- Face / skin -->
  <rect x="24" y="32" width="64" height="72" fill="#e0b890"/>
  <rect x="16" y="40" width="12" height="20" fill="#e0b890"/>
  <rect x="84" y="40" width="12" height="20" fill="#e0b890"/>
  <rect x="32" y="48" width="48" height="40" fill="#e8c4a0"/>
  <!-- Glasses -->
  <rect x="24" y="48" width="22" height="16" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="66" y="48" width="22" height="16" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="46" y="54" width="20" height="4" fill="#1a1a1a"/>
  <!-- Mole below left lip -->
  <rect x="48" y="88" width="4" height="4" fill="#2a2020"/>
</svg>
