<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TATTOO MAP</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <style>
        :root {
            --paper: #f4f1e6;
            --ink: #4a5c3a;
            --ink-soft: #6b7d5a;
            --shadow: rgba(74, 92, 58, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Georgia, "Times New Roman", serif;
            color: var(--ink);
            background-color: var(--paper);
            background-image:
                radial-gradient(ellipse 120% 80% at 50% 0%, rgba(255, 255, 255, 0.5) 0%, transparent 55%),
                linear-gradient(180deg, #ebe6d8 0%, var(--paper) 35%, #e8e4d6 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 50px 3rem;
        }

        header {
            text-align: center;
            max-width: 42rem;
            margin-bottom: 1.5rem;
        }

        header h1 {
            font-size: clamp(1.35rem, 4vw, 1.85rem);
            font-weight: 400;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin: 0 0 0.5rem;
            color: var(--ink);
        }

        header p {
            margin: 0;
            font-size: 0.95rem;
            color: var(--ink-soft);
            line-height: 1.5;
        }

        .site-nav {
            margin: 0.85rem 0 0;
            font-size: 0.88rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .site-nav a {
            color: var(--ink);
            text-decoration: underline;
            text-underline-offset: 4px;
            text-decoration-color: rgba(74, 92, 58, 0.35);
        }

        .site-nav a:hover {
            text-decoration-color: var(--ink-soft);
        }

        .site-nav a[aria-current="page"] {
            font-weight: 600;
            text-decoration: none;
            color: var(--ink);
        }

        .site-nav span {
            color: var(--ink-soft);
            margin: 0 0.35rem;
        }

        .map-stage {
            align-self: stretch;
            width: 100%;
            max-width: none;
            position: relative;
        }

        .map-ellipse {
            border-radius: 50% / 42%;
            padding: clamp(0.75rem, 3vw, 1.5rem);
            background: linear-gradient(145deg, #faf8f2 0%, #f0ebe0 50%, #e5dfd2 100%);
            box-shadow:
                0 0 0 1px rgba(74, 92, 58, 0.15),
                0 12px 40px var(--shadow),
                inset 0 1px 0 rgba(255, 255, 255, 0.7);
        }

        .map-ellipse figure {
            margin: 0;
            border-radius: 50% / 42%;
            overflow: hidden;
            background: #e8e4dc;
        }

        .map-viewport {
            position: relative;
            overflow: hidden;
            border-radius: inherit;
            line-height: 0;
        }

        #map {
            display: block;
            width: 100%;
            height: min(62vh, 560px);
            min-height: 380px;
            background: #e5e1d8;
            z-index: 0;
        }

        .map-viewport .leaflet-control-container {
            font-family: system-ui, sans-serif;
        }

        .city-marker-label {
            background: rgba(244, 241, 230, 0.96) !important;
            border: 1px solid rgba(74, 92, 58, 0.45) !important;
            border-radius: 4px !important;
            box-shadow: 0 1px 5px rgba(74, 92, 58, 0.18) !important;
            color: #3d4d32 !important;
            font-family: Georgia, "Times New Roman", serif !important;
            font-size: 11px !important;
            font-weight: 600 !important;
            padding: 3px 7px !important;
        }

        .city-marker-label::before {
            display: none !important;
        }

        .leaflet-tooltip.city-marker-label {
            margin-top: 2px !important;
        }

        .leaflet-tooltip-top.city-marker-label {
            margin-bottom: 0 !important;
        }

        .pastel-pin-marker {
            background: transparent !important;
            border: none !important;
        }

        .pastel-pin-marker svg {
            display: block;
            filter: drop-shadow(0 1px 2px rgba(74, 92, 58, 0.22));
        }

        .leaflet-container {
            font-family: Georgia, "Times New Roman", serif;
        }

        .map-hint {
            margin-top: 0.65rem;
            text-align: center;
            font-size: 0.78rem;
            color: var(--ink-soft);
            line-height: 1.45;
        }

        .map-attribution-note {
            margin-top: 0.85rem;
            padding: 0.65rem 1rem;
            max-width: 42rem;
            margin-left: auto;
            margin-right: auto;
            font-size: 0.78rem;
            color: var(--ink-soft);
            line-height: 1.45;
            text-align: center;
        }

        figcaption {
            margin-top: 1.1rem;
            text-align: center;
            font-size: 0.82rem;
            font-style: italic;
            color: var(--ink-soft);
            letter-spacing: 0.02em;
        }

        .map-photo-trigger {
            margin-top: 0.55rem;
            padding: 0.35rem 0.65rem;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 0.78rem;
            color: var(--paper);
            background: var(--ink);
            border: 1px solid rgba(74, 92, 58, 0.35);
            border-radius: 5px;
            cursor: pointer;
        }

        .map-photo-trigger:hover {
            opacity: 0.92;
        }

        .leaflet-popup-content .map-photo-trigger {
            margin-top: 0.65rem;
        }

        .photo-modal {
            position: fixed;
            inset: 0;
            z-index: 11000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
        }

        .photo-modal[hidden] {
            display: none !important;
        }

        .photo-modal__backdrop {
            position: absolute;
            inset: 0;
            background: rgba(45, 52, 38, 0.45);
            cursor: pointer;
        }

        .photo-modal__panel {
            position: relative;
            z-index: 1;
            max-width: min(92vw, 520px);
            max-height: min(88vh, 720px);
            overflow: auto;
            padding: 1rem 1.15rem 1.15rem;
            background: linear-gradient(165deg, #faf8f2 0%, #ebe6d8 100%);
            border-radius: 12px;
            box-shadow:
                0 0 0 1px rgba(74, 92, 58, 0.18),
                0 18px 48px rgba(74, 92, 58, 0.2);
        }

        .photo-modal__close {
            position: absolute;
            top: 0.45rem;
            right: 0.45rem;
            width: 2rem;
            height: 2rem;
            border: none;
            border-radius: 8px;
            background: rgba(74, 92, 58, 0.12);
            color: var(--ink);
            font-size: 1.35rem;
            line-height: 1;
            cursor: pointer;
        }

        .photo-modal__close:hover {
            background: rgba(74, 92, 58, 0.22);
        }

        .photo-modal__title {
            margin: 0 2rem 0.75rem 0;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--ink);
            padding-right: 0.25rem;
        }

        .photo-modal__gallery {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .photo-modal__gallery figure {
            margin: 0;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(74, 92, 58, 0.2);
            background: rgba(255, 255, 255, 0.45);
        }

        .photo-modal__gallery img {
            display: block;
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <header>
        <nav class="site-nav" aria-label="Site pages">
            <a href="index.html" aria-current="page">Map</a>
            <span aria-hidden="true">·</span>
            <a href="timeline.html">Timeline</a>
            <span aria-hidden="true">·</span>
            <a href="gallery.html">Gallery</a>
        </nav>
        <h1>AUDREY'S TATTOO MAP</h1>
        <p> 12 tattoos, 9 artists, and counting...</p>
        <p> See where I've been and what I got! </p>
    </header>

    <div class="map-stage">
        <div class="map-ellipse">
            <figure>
                <div class="map-viewport">
                    <div id="map" title="Map with location pins" role="application" aria-label="Interactive map with nine studio locations"></div>
                </div>
            </figure>
        </div>
        <!-- <p class="map-hint">Drag to move the map; + and − to zoom. Hover a pin for the studio and city; click for the address. If a pin has photos, use <strong>Photos</strong> for a gallery pop-up.</p>
        <p class="map-attribution-note">Tiles © <a href="https://www.openstreetmap.org/copyright" rel="noopener noreferrer">OpenStreetMap</a> contributors, © <a href="https://carto.com/attributions" rel="noopener noreferrer">CARTO</a>. Border outlines from <a href="https://www.naturalearthdata.com/" rel="noopener noreferrer">Natural Earth</a>. No API key.</p>
        <figcaption>Elliptical frame around an interactive map.</figcaption> -->
    </div>

    <div id="photo-modal" class="photo-modal" hidden aria-hidden="true">
        <div class="photo-modal__backdrop" tabindex="-1" aria-label="Close gallery"></div>
        <div class="photo-modal__panel" role="dialog" aria-modal="true" aria-labelledby="photo-modal-title">
            <button type="button" class="photo-modal__close" aria-label="Close">&times;</button>
            <h2 id="photo-modal-title" class="photo-modal__title"></h2>
            <div class="photo-modal__gallery"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        (function () {
            /* Coordinates from OpenStreetMap Nominatim (approx. building entrances). */
            var places = [
                {
                    name: "Black Lantern Tattoo",
                    city: "Campbell",
                    state: "CA",
                    country: "USA",
                    lat: 37.2661585,
                    lng: -121.9417284,
                    lines: ["3155 S Bascom Ave E", "Campbell, CA 95008"],
                    images: ["black-lantern.jpg", "black-lantern2.jpg"]
                },
                {
                    name: "Dark Water Tattoo",
                    city: "Berkeley",
                    state: "CA",
                    country: "USA",
                    lat: 37.8685394,
                    lng: -122.2916008,
                    lines: ["2035 San Pablo Ave", "Berkeley, CA 94702"],
                    images: ["dark-water.jpg"]
                },
                {
                    name: "Homeroom Tattoo",
                    city: "San Jose",
                    state: "CA",
                    country: "USA",
                    lat: 37.2279981,
                    lng: -121.7752443,
                    lines: ["7034 Santa Teresa Blvd", "San Jose, CA 95139"],
                    images: ["homeroom.jpg", "homeroom-sketch.jpg"]
                },
                {
                    name: "Parallax",
                    city: "Milpitas",
                    state: "CA",
                    country: "USA",
                    lat: 37.4062989,
                    lng: -121.8967641,
                    lines: ["1819 Houret Court", "Milpitas, CA 95035"],
                    images: ["parallax.jpg", "parallax-sketch.jpg"]
                },
                {
                    name: "Blu Estate Studio",
                    city: "Padua",
                    country: "Italy",
                    lat: 45.419564,
                    lng: 11.876524,
                    lines: ["Via Annibale da Bassano, 3", "35135 Padua, Italy"],
                    images: ["blu-estate.jpg"]
                },
                {
                    name: "Black Serum Tattoo",
                    city: "San Francisco",
                    state: "CA",
                    country: "USA",
                    lat: 37.7678066,
                    lng: -122.422347,
                    lines: ["310 Valencia St", "San Francisco, CA 94103"],
                    images: [
                        "black-serum-miffy.jpg",
                        "black-serum-spiderweb.jpg",
                        "black-serum-cherry-sketch.jpg"
                    ]
                },
                {
                    name: "American Body Art",
                    city: "Paris",
                    country: "France",
                    lat: 48.8603722,
                    lng: 2.3477272,
                    lines: ["7 rue des Innocents", "75001 Paris, France"],
                    images: ["american-body-art.jpg", "american-body-art-sketch.jpg"]
                },
                {
                    name: "Osmose",
                    city: "Paris",
                    country: "France",
                    lat: 48.8890412,
                    lng: 2.3235598,
                    lines: ["3 rue Dautancourt", "Paris, France"],
                    images: ["osmose.jpg", "osmose-sketch.jpg"]
                },
                {
                    name: "Sticky Fingers",
                    city: "San Francisco",
                    state: "CA",
                    country: "USA",
                    lat: 37.7754727,
                    lng: -122.4581811,
                    lines: ["792 Arguello Blvd", "San Francisco, CA 94118"],
                    images: ["sticky-fingers.jpg", "sticky-fingers-sketch.jpg", "sticky-fingers-sketch2.jpg"]
                }
            ];

            function placeLabel(p) {
                if (p.country === "USA") {
                    return p.name + " · " + p.city + ", " + p.state + " · USA";
                }
                if (p.country === "Italy") {
                    return p.name + " · " + p.city + " · Italy";
                }
                return p.name + " · " + p.city + " · France";
            }

            function escapeHtml(s) {
                return String(s)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;");
            }

            function placePopupHtml(p, placeIndex) {
                var body = p.lines.map(function (line) {
                    return escapeHtml(line);
                }).join("<br>");
                var imgs = p.images && p.images.length;
                var photoBtn = imgs
                    ? '<br><button type="button" class="map-photo-trigger" data-place-index="' +
                      placeIndex +
                      '">Photos</button>'
                    : "";
                return (
                    "<strong>" +
                    escapeHtml(p.name) +
                    "</strong><br>" +
                    body +
                    "<br><small style='opacity:.85'>" +
                    escapeHtml(placeLabel(p)) +
                    "</small>" +
                    photoBtn
                );
            }

            function openPhotoModal(place) {
                var modal = document.getElementById("photo-modal");
                var titleEl = modal.querySelector(".photo-modal__title");
                var gallery = modal.querySelector(".photo-modal__gallery");
                titleEl.textContent = place.name;
                gallery.innerHTML = (place.images || [])
                    .map(function (src) {
                        return (
                            "<figure><img src=\"" +
                            escapeHtml(src) +
                            "\" alt=\"" +
                            escapeHtml(place.name) +
                            "\" loading=\"lazy\"></figure>"
                        );
                    })
                    .join("");
                modal.hidden = false;
                modal.setAttribute("aria-hidden", "false");
            }

            function closePhotoModal() {
                var modal = document.getElementById("photo-modal");
                modal.hidden = true;
                modal.setAttribute("aria-hidden", "true");
            }

            document.addEventListener("click", function (ev) {
                var btn = ev.target.closest(".map-photo-trigger");
                if (!btn) {
                    return;
                }
                ev.preventDefault();
                ev.stopPropagation();
                var i = parseInt(btn.getAttribute("data-place-index"), 10);
                if (!places[i] || !places[i].images || !places[i].images.length) {
                    return;
                }
                openPhotoModal(places[i]);
            });

            document.getElementById("photo-modal").addEventListener("click", function (ev) {
                if (
                    ev.target.classList.contains("photo-modal__backdrop") ||
                    ev.target.closest(".photo-modal__close")
                ) {
                    closePhotoModal();
                }
            });

            document.addEventListener("keydown", function (ev) {
                if (ev.key !== "Escape") {
                    return;
                }
                var modalEl = document.getElementById("photo-modal");
                if (!modalEl.hidden) {
                    closePhotoModal();
                }
            });

            var NE_COUNTRIES =
                "https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@master/geojson/ne_110m_admin_0_countries.geojson";

            var worldBounds = L.latLngBounds(L.latLng(-85, -180), L.latLng(85, 180));
            var crsSingleWorld = L.extend({}, L.CRS.EPSG3857, { wrapLng: null });

            var map = L.map("map", {
                crs: crsSingleWorld,
                worldCopyJump: false,
                fadeAnimation: false,
                zoomAnimation: false,
                markerZoomAnimation: false,
                preferCanvas: true,
                zoomSnap: 0.25,
                zoomDelta: 0.25,
                wheelPxPerZoomLevel: 280,
                maxBounds: worldBounds,
                maxBoundsViscosity: 1
            });

            var retina = L.Browser.retina ? "@2x" : "";
            L.tileLayer(
                "https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}" + retina + ".png",
                {
                    attribution:
                        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> ' +
                        '&copy; <a href="https://carto.com/attributions">CARTO</a>',
                    subdomains: "abcd",
                    maxZoom: 18,
                    updateWhenZooming: false,
                    noWrap: true
                }
            ).addTo(map);

            fetch(NE_COUNTRIES)
                .then(function (r) {
                    return r.json();
                })
                .then(function (data) {
                    L.geoJSON(data, {
                        interactive: false,
                        style: function () {
                            return {
                                color: "#8a9b82",
                                weight: 0.45,
                                opacity: 0.65,
                                fillColor: "#c4c9b8",
                                fillOpacity: 0.035
                            };
                        }
                    }).addTo(map);
                })
                .catch(function () {});

            var pastelPinPalette = [
                { fill: "#8fd4b8", stroke: "#3d8f6a" },
                { fill: "#ffb3d4", stroke: "#c24d7a" },
                { fill: "#ffd699", stroke: "#c99430" },
                { fill: "#a8c4f5", stroke: "#4a6ec4" },
                { fill: "#d4be98", stroke: "#8a6638" },
                { fill: "#c4b3ea", stroke: "#6a4aa6" },
                { fill: "#ffc0a8", stroke: "#c86048" },
                { fill: "#9ee8d8", stroke: "#2a9f88" },
                { fill: "#f0b8d8", stroke: "#b04878" }
            ];

            function pastelPinIcon(fill, stroke) {
                var svg =
                    '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="34" viewBox="0 0 22 34" aria-hidden="true">' +
                    '<path fill="' +
                    fill +
                    '" stroke="' +
                    stroke +
                    '" stroke-width="1.35" stroke-linejoin="round" ' +
                    'd="M11 1.75c-4.05 0-7.35 3.15-7.35 7.03 0 5.28 7.35 13.72 7.35 13.72S18.35 14.06 18.35 8.78c0-3.88-3.3-7.03-7.35-7.03z"/>' +
                    '<circle cx="11" cy="9.25" r="3.25" fill="rgba(255,255,255,.88)"/></svg>';
                return L.divIcon({
                    className: "pastel-pin-marker",
                    html: svg,
                    iconSize: [22, 34],
                    iconAnchor: [11, 34],
                    popupAnchor: [0, -30],
                    tooltipAnchor: [0, -32]
                });
            }

            var tipOffsetY = -6;

            var bounds = L.latLngBounds([]);
            places.forEach(function (p, placeIndex) {
                var latlng = [p.lat, p.lng];
                bounds.extend(latlng);
                var label = placeLabel(p);
                var hue = pastelPinPalette[placeIndex % pastelPinPalette.length];
                L.marker(latlng, { icon: pastelPinIcon(hue.fill, hue.stroke) })
                    .bindPopup(placePopupHtml(p, placeIndex))
                    .bindTooltip(label, {
                        direction: "top",
                        sticky: true,
                        opacity: 1,
                        offset: [0, tipOffsetY],
                        className: "city-marker-label"
                    })
                    .addTo(map);
            });

            map.fitBounds(bounds, { padding: [52, 52], maxZoom: 6 });
            map.setMaxBounds(worldBounds);
            map.panInsideBounds(worldBounds, { animate: false, padding: [0, 0] });

            requestAnimationFrame(function () {
                map.invalidateSize();
                map.setMaxBounds(worldBounds);
                map.panInsideBounds(worldBounds, { animate: false, padding: [0, 0] });
            });
        })();
    </script>
</body>
</html>
