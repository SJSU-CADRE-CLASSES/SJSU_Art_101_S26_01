<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thomas Cyclical Attractor Telemetry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

    <div class="lfo-container">
        <h1>LFO Modulation</h1>

        <div class="control-group toggle-group">
            <label for="toggle-lfo-enabled">LFO <span id="val-lfo-enabled" class="value-display">OFF</span></label>
            <input type="checkbox" id="toggle-lfo-enabled">
        </div>

        <div class="control-group">
            <label for="select-lfo-waveform">Waveform <span id="val-lfo-waveform" class="value-display">SINE</span></label>
            <select id="select-lfo-waveform">
                <option value="sine">Sine</option>
                <option value="triangle">Triangle</option>
                <option value="ramp">Ramp</option>
                <option value="square">Square</option>
            </select>
        </div>

        <div class="control-group">
            <label for="slider-lfo-frequency">LFO Frequency <span id="val-lfo-frequency" class="value-display">0.20</span></label>
            <input type="range" id="slider-lfo-frequency" min="0.00" max="5.00" step="0.01" value="0.20">
        </div>

        <div class="control-group">
            <label for="select-lfo-param">Add LFO Target</label>
            <div class="inline-row">
                <select id="select-lfo-param"></select>
                <button id="btn-lfo-add" type="button">Add</button>
            </div>
        </div>

        <div class="telemetry lfo-active-block">
            <div class="lfo-active-title">Active LFO Items</div>
            <div id="lfo-active-list" class="lfo-active-list"></div>
        </div>
    </div>

    <div class="container">
        <h1>Thomas Attractor Engine</h1>

        <div class="control-group">
            <label for="slider-ui-size">UI Size <span id="val-ui-size" class="value-display">50%</span></label>
            <input type="range" id="slider-ui-size" min="0.3" max="1.2" step="0.01" value="0.5">
        </div>

        <div class="control-group">
            <label for="slider-b">Chaos (b) <span id="val-b" class="value-display">0.19000</span></label>
            <input type="range" id="slider-b" min="0.00001" max="0.42000" step="0.00001" value="0.19000">
        </div>

        <div class="control-group">
            <label for="slider-dt">Speed (dt) <span id="val-dt" class="value-display">0.10000</span></label>
            <input type="range" id="slider-dt" min="0.00001" max="3.50000" step="0.00001" value="0.10000">
        </div>

        <div class="control-group">
            <label for="slider-cam-z">Camera Orbit Radius <span id="val-cam-z" class="value-display">20.0</span></label>
            <input type="range" id="slider-cam-z" min="1.0" max="20.0" step="0.1" value="20.0">
        </div>

        <div class="control-group">
            <label for="slider-ramp-frequency">Ramp Frequency <span id="val-ramp-frequency" class="value-display">0.03</span></label>
            <input type="range" id="slider-ramp-frequency" min="-1.00" max="1.00" step="0.01" value="0.03">
        </div>

        <div class="control-group">
            <label for="slider-trail-length">Trail Length <span id="val-trail-length" class="value-display">2000</span></label>
            <input type="range" id="slider-trail-length" min="0" max="2000" step="1" value="2000">
        </div>

        <div class="control-group">
            <label for="slider-steps-per-frame">Steps / Frame <span id="val-steps-per-frame" class="value-display">20</span></label>
            <input type="range" id="slider-steps-per-frame" min="1" max="1000" step="1" value="20">
        </div>

        <div class="control-group">
            <label for="slider-internal-substeps">Internal Substeps <span id="val-internal-substeps" class="value-display">1</span></label>
            <input type="range" id="slider-internal-substeps" min="1" max="500" step="1" value="1">
        </div>

        <div class="control-group">
            <label for="slider-integrator-fidelity">Integrator Fidelity <span id="val-integrator-fidelity" class="value-display">0.00</span></label>
            <input type="range" id="slider-integrator-fidelity" min="0" max="1" step="0.01" value="0">
        </div>

        <div class="control-group toggle-group">
            <label for="toggle-arc-resample">Arc-Length Resample <span id="val-arc-resample" class="value-display">OFF</span></label>
            <input type="checkbox" id="toggle-arc-resample">
        </div>

        <div class="control-group">
            <label for="slider-arc-resample-amount">Arc Resample Amount <span id="val-arc-resample-amount" class="value-display">100%</span></label>
            <input type="range" id="slider-arc-resample-amount" min="0" max="1" step="0.01" value="1">
        </div>

        <div class="control-group">
            <label for="slider-point-jitter">Point Jitter <span id="val-point-jitter" class="value-display">0.000</span></label>
            <input type="range" id="slider-point-jitter" min="0" max="0.25" step="0.001" value="0">
        </div>

        <div class="control-group">
            <label for="slider-gain-x">X Gain <span id="val-gain-x" class="value-display">1.00</span></label>
            <input type="range" id="slider-gain-x" min="0.1" max="4" step="0.01" value="1">
        </div>

        <div class="control-group">
            <label for="slider-gain-y">Y Gain <span id="val-gain-y" class="value-display">1.00</span></label>
            <input type="range" id="slider-gain-y" min="0.1" max="4" step="0.01" value="1">
        </div>

        <div class="control-group">
            <label for="slider-gain-z">Z Gain <span id="val-gain-z" class="value-display">1.00</span></label>
            <input type="range" id="slider-gain-z" min="0.1" max="4" step="0.01" value="1">
        </div>

        <button id="btn-reset">Reset Engine</button>

        <div id="telemetry" class="telemetry">
            X: 0.000 | Y: 0.000 | Z: 0.000
        </div>
    </div>

    <script src="script.js"></script>

</body>

</html>
