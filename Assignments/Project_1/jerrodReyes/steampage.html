<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEAM — The Wired</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'JetBrains Mono', monospace;
            min-height: 100vh;
            background: #000000;
            color: #00ff88;
            overflow: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }
        .bg-logo {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: url('Copland_OS_Logo.gif') center center / contain no-repeat;
            opacity: 0.05;
            pointer-events: none;
        }
        .scanlines {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(255, 255, 255, 0.03) 2px,
                rgba(255, 255, 255, 0.03) 4px
            );
            z-index: 10;
        }
        .noise {
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            z-index: 11;
        }
        .content {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: clamp(1.25rem, 3vw, 1.75rem);
            font-weight: 600;
            margin-bottom: 1.5rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
            animation: flicker 4s ease-in-out infinite;
        }
        .year-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .year-btn {
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            color: #00ff88;
            background: transparent;
            border: 1px solid rgba(0, 255, 136, 0.5);
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }
        .year-btn:hover {
            background: rgba(0, 255, 136, 0.1);
            box-shadow: 0 0 16px rgba(0, 255, 136, 0.2);
            border-color: #00ff88;
        }
        .year-btn.active {
            background: rgba(0, 255, 136, 0.15);
            border-color: #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }
        .image-area {
            width: 100%;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 8px;
            padding: 1rem;
        }
        .image-area img {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
            display: block;
        }
        p {
            font-size: 0.85rem;
            line-height: 1.8;
            color: rgba(0, 255, 136, 0.85);
            margin-bottom: 1rem;
            text-align: center;
        }
        .link {
            display: inline-block;
            margin-top: 0.5rem;
            color: #00ff88;
            text-decoration: none;
            border: 1px solid #00ff88;
            padding: 10px 24px;
            border-radius: 4px;
            transition: background 0.2s ease, box-shadow 0.2s ease;
            letter-spacing: 0.15em;
        }
        .link:hover {
            background: rgba(0, 255, 136, 0.12);
            box-shadow: 0 0 24px rgba(0, 255, 136, 0.25);
        }
        @keyframes flicker {
            0%, 90%, 100% { opacity: 1; }
            92% { opacity: 0.85; }
            94% { opacity: 1; }
            96% { opacity: 0.9; }
            98% { opacity: 1; }
        }
        .sync-rect {
            position: fixed;
            z-index: 0.5;
            pointer-events: none;
            background: transparent;
            border: 2px solid #00ff88;
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.4);
            opacity: 0.85;
            animation: rectGlitch 0.15s steps(2, end) infinite;
            display: none;
        }
        @keyframes rectGlitch {
            0%, 100% {
                opacity: 0.9;
                border-color: #00ff88;
                box-shadow: 0 0 12px rgba(0, 255, 136, 0.5), 0.5px 0 0 rgba(255, 0, 100, 0.3);
            }
            25% {
                opacity: 0.7;
                border-color: #00ffaa;
                box-shadow: 0 0 8px rgba(0, 255, 136, 0.3), -0.5px 0 0 rgba(0, 200, 255, 0.2);
            }
            50% {
                opacity: 1;
                border-color: #00ff88;
                box-shadow: 0 0 16px rgba(0, 255, 136, 0.6);
            }
            75% {
                opacity: 0.75;
                border-color: #00cc6a;
                box-shadow: 0 0 6px rgba(0, 255, 136, 0.2), 0 0.5px 0 rgba(255, 255, 255, 0.1);
            }
        }
        .hidden-left-btn {
            position: fixed;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 20;
            padding: 10px 16px;
            border: 1px solid rgba(0, 255, 136, 0.5);
            border-radius: 6px;
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.2s ease, visibility 0.2s ease, background 0.2s ease;
        }
        .hidden-left-btn.visible {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        .hidden-left-btn:hover {
            background: rgba(0, 255, 136, 0.35);
            box-shadow: 0 0 16px rgba(0, 255, 136, 0.2);
        }
    </style>
</head>
<body>
    <div class="bg-logo" aria-hidden="true"></div>
    <div class="sync-rect" id="syncRect" aria-hidden="true"></div>
    <div class="scanlines"></div>
    <div class="noise"></div>
    <button type="button" class="hidden-left-btn" id="hiddenSteamStatsBtn" title="Top Time Wasters" aria-label="Top Time Wasters">Top Time Wasters</button>
    <div class="content">
        <h1>STEAM</h1>
        <div class="year-buttons">
            <button type="button" class="year-btn active" data-year="2022">2022</button>
            <button type="button" class="year-btn" data-year="2023">2023</button>
            <button type="button" class="year-btn" data-year="2024">2024</button>
            <button type="button" class="year-btn" data-year="2025">2025</button>
        </div>
        <div class="image-area">
            <img id="steamImage" src="Steam 2022.png" alt="Steam 2022">
        </div>
        <p>You have reached the STEAM node.</p>
        <a href="thewired.html" class="link">← Back to The Wired</a>
    </div>
    <script>
        (function () {
            var img = document.getElementById('steamImage');
            var buttons = document.querySelectorAll('.year-btn');
            buttons.forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var year = btn.getAttribute('data-year');
                    img.src = 'Steam ' + year + '.png';
                    img.alt = 'Steam ' + year;
                    buttons.forEach(function (b) { b.classList.remove('active'); });
                    btn.classList.add('active');
                });
            });

            var syncRect = document.getElementById('syncRect');
            var hiddenSteamStatsBtn = document.getElementById('hiddenSteamStatsBtn');
            var rectVisible = false;
            var rectBounds = { left: 0, top: 0, width: 0, height: 0 };

            function updateHiddenButtonVisibility() {
                if (!hiddenSteamStatsBtn) return;
                if (!rectVisible || rectBounds.width <= 0 || rectBounds.height <= 0) {
                    hiddenSteamStatsBtn.classList.remove('visible');
                    return;
                }
                var br = hiddenSteamStatsBtn.getBoundingClientRect();
                var r = rectBounds;
                var rRight = r.left + r.width;
                var rBottom = r.top + r.height;
                var inside = br.left >= r.left && br.right <= rRight &&
                    br.top >= r.top && br.bottom <= rBottom;
                if (inside) {
                    hiddenSteamStatsBtn.classList.add('visible');
                } else {
                    hiddenSteamStatsBtn.classList.remove('visible');
                }
            }

            if (hiddenSteamStatsBtn) {
                hiddenSteamStatsBtn.addEventListener('click', function () {
                    window.open('steamstats.html', '_blank', 'noopener,noreferrer');
                });
            }

            var wsScheme = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            try {
                var ws = new WebSocket(wsScheme + '//' + window.location.host);
                ws.onopen = function () {
                    ws.send(JSON.stringify({ type: 'register', page: 'steampage' }));
                };
                ws.onmessage = function (e) {
                    var msg = JSON.parse(e.data);
                    if (msg.type === 'browser' && msg.left != null && msg.top != null && msg.width != null && msg.height != null && syncRect) {
                        rectBounds = { left: msg.left, top: msg.top, width: msg.width, height: msg.height };
                        syncRect.style.left = msg.left + 'px';
                        syncRect.style.top = msg.top + 'px';
                        syncRect.style.width = msg.width + 'px';
                        syncRect.style.height = msg.height + 'px';
                        syncRect.style.display = 'block';
                        rectVisible = true;
                        requestAnimationFrame(updateHiddenButtonVisibility);
                    }
                };
            } catch (err) {}
            if (syncRect) syncRect.style.display = 'none';
            if (hiddenSteamStatsBtn) hiddenSteamStatsBtn.classList.remove('visible');
            window.addEventListener('resize', function () { requestAnimationFrame(updateHiddenButtonVisibility); });
        })();
    </script>
</body>
</html>
