<div class="chat-interface">
    <div class="chat-messages" id="chat-messages">
        <div class="chat-message"><span class="sender">J. O'NEIL:</span> WHAT THE FUCK DID I DO??</div>
        <div class="chat-message"><span class="sender">YOU:</span> A LIFE, JIMMY, YOU KNOW WHAT THAT IS? IT'S THE SHIT THAT HAPPENS WHILE YOU'RE WAITING FOR MOMENTS THAT NEVER COME.</div>
        <div class="chat-message"><span class="sender">J. O'NEIL:</span> THATS SOME SPIDERMAN SHIT RIGHT THERE!!!</div>
        <div class="chat-message"><span class="sender">YOU:</span> FUNNY THING IS THEY WERE ALL DEAD SERIOUS.</div>
    </div>
    <div class="chat-input-row">
        <div class="chat-input-wrap">
            <input type="text" class="chat-input" id="chat-input" placeholder="DON'T THINK TOO MUCH ABOUT IT" autocomplete="off">
        </div>
        <div class="char-keyboard-wrap">
            <div class="char-keyboard" id="char-keyboard">
                <button type="button" class="char-key" data-char="à">à</button>
                <button type="button" class="char-key" data-char="ç">ç</button>
                <button type="button" class="char-key" data-char="č">č</button>
                <button type="button" class="char-key" data-char="ž">ž</button>
                <button type="button" class="char-key" data-char="ť">ť</button>
                <button type="button" class="char-key" data-char="ě">ě</button>
                <button type="button" class="char-key" data-char="ñ">ñ</button>
                <button type="button" class="char-key" data-char="ä">ä</button>
                <button type="button" class="char-key" data-char="ř">ř</button>
                <button type="button" class="char-key" data-char="ž">ž</button>
                <button type="button" class="char-key" data-char="ů">ů</button>
                <button type="button" class="char-key" data-char="é">é</button>
                <button type="button" class="char-key" data-char="ĺ">ĺ</button>
                <button type="button" class="char-key" data-char="ó">ó</button>
                <button type="button" class="char-key" data-char="í">í</button>
                <button type="button" class="char-key" data-char="§">§</button>
                <button type="button" class="char-key" data-char="š">š</button>
            </div>
            <button type="button" class="chat-send-btn" id="chat-send">SEND</button>
        </div>
    </div>
</div>
