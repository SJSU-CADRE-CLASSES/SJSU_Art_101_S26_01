<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stone Library</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a1628;
      min-height: 100vh;
      overflow: hidden;
    }
    #underwater-view {
      position: fixed;
      inset: 0;
      z-index: 100;
    }
    #underwater-view #canvas { display: block; width: 100vw; height: 100vh; }
    #underwater-view #ocean-filter {
      position: fixed; inset: 0; pointer-events: none; z-index: 5;
      background:
        radial-gradient(ellipse 80% 80% at 50% 50%, transparent 30%, rgba(0,20,40,0.4) 70%, rgba(0,10,25,0.7) 100%),
        linear-gradient(180deg, rgba(0,40,80,0.15) 0%, transparent 40%, rgba(0,30,60,0.2) 100%);
      mix-blend-mode: multiply;
    }
    #underwater-view #canvas { filter: saturate(0.85) contrast(1.05); }
    #underwater-view #prompt {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.7); font-family: system-ui, sans-serif; font-size: 1rem;
      pointer-events: none; z-index: 10;
    }
    #underwater-view #light-btn {
      position: fixed; top: 2.75rem; right: 1rem;
      padding: 0.5rem 1rem; background: rgba(0,40,80,0.6); border: 1px solid rgba(100,180,220,0.5);
      color: #7ab8d4; font-family: system-ui, sans-serif; font-size: 0.9rem;
      cursor: pointer; z-index: 10; border-radius: 4px;
    }
    #underwater-view #light-btn:hover { background: rgba(0,60,100,0.8); }
    #underwater-view #light-btn.on { background: rgba(20,80,120,0.9); box-shadow: 0 0 12px rgba(122,184,212,0.4); }
    #underwater-view #compass {
      position: fixed; top: 0; left: 50%; transform: translateX(-50%);
      width: 280px; height: 40px; overflow: hidden; z-index: 10; pointer-events: none;
    }
    #underwater-view #compass-line {
      position: absolute; left: 0; right: 0; top: 50%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(120,180,220,0.6) 10%, rgba(120,180,220,0.8) 50%, rgba(120,180,220,0.6) 90%, transparent);
    }
    #underwater-view #compass-ticks {
      position: absolute; left: 50%; top: 50%; width: 720px; height: 20px;
      margin: -10px 0 0 -360px; transform: translateX(0); transition: transform 0.08s ease-out;
    }
    #underwater-view .compass-tick {
      position: absolute; top: 50%; width: 1px; background: rgba(140,200,240,0.5); left: 0;
      transform: translateY(-50%);
    }
    #underwater-view .compass-tick.small { height: 6px; }
    #underwater-view .compass-tick.cardinal { height: 12px; background: rgba(170,220,255,0.9); }
    #underwater-view .compass-tick.cardinal::after {
      content: attr(data-dir); position: absolute; top: -10px; left: 50%; transform: translate(-50%, 0);
      font-size: 9px; font-family: system-ui, sans-serif; color: rgba(180,220,255,0.95); white-space: nowrap;
    }
    #underwater-view #compass-library {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 10px; font-weight: 300; letter-spacing: 0.15em; text-transform: uppercase;
      color: #aae5ff; white-space: nowrap; opacity: 0; transition: opacity 0.15s;
      pointer-events: none;
    }
    #underwater-view #compass-library.visible { opacity: 1; }
    #underwater-view #crosshair {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 6px; height: 6px; border-radius: 50%; border: 1px solid rgba(180,190,200,0.7);
      background: transparent; pointer-events: none; z-index: 12;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    #underwater-view #crosshair.interactable {
      border-color: rgba(255,255,255,0.95); box-shadow: 0 0 6px rgba(255,255,255,0.4);
    }
    #underwater-view #boost-meter {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, calc(-50% + 14px));
      width: 60px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px;
      pointer-events: none; z-index: 12; overflow: hidden;
    }
    #underwater-view #boost-meter-fill {
      height: 100%; width: 100%; background: rgba(255,255,255,0.9); border-radius: 2px;
      transform-origin: left; transition: transform 0.08s ease-out;
    }
    #underwater-view #interact-prompt {
      position: fixed; bottom: 25%; left: 50%; transform: translateX(-50%);
      color: rgba(200,230,255,0.95); font-family: system-ui, sans-serif; font-size: 1rem;
      pointer-events: none; z-index: 15; opacity: 0; transition: opacity 0.2s;
    }
    #underwater-view #interact-prompt.visible { opacity: 1; }
    #underwater-view #drill-ui {
      position: fixed; inset: 0; z-index: 20; display: none; flex-direction: column;
      align-items: center; justify-content: flex-end; padding-bottom: 25%;
      pointer-events: none;
    }
    #underwater-view #drill-ui.active { display: flex; pointer-events: auto; }
    #underwater-view #drill-input {
      width: min(400px, 90vw); padding: 0.75rem 1rem; font-size: 1rem; font-family: system-ui, sans-serif;
      background: rgba(0,30,50,0.9); border: 1px solid rgba(100,180,220,0.5);
      color: #e0f0ff; border-radius: 6px; outline: none;
    }
    #underwater-view #drill-input::placeholder { color: rgba(180,220,255,0.5); }
    #underwater-view #drill-hint { margin-top: 0.5rem; font-size: 0.8rem; color: rgba(160,200,230,0.7); }
    #underwater-view #read-close {
      position: absolute; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
      color: rgba(180,220,255,0.8); font-size: 0.85rem; font-family: "Courier New", Courier, monospace;
    }
    #underwater-view #read-overlay {
      position: fixed; inset: 0; z-index: 25; display: none;
      flex-direction: column; align-items: center; justify-content: flex-start;
      padding-top: 48px; pointer-events: none;
    }
    #underwater-view #read-overlay.active { display: flex; pointer-events: auto; }
    #underwater-view #read-message {
      width: min(90vw, 560px); padding: 0.5rem 0.25rem 0;
      color: #d8ecff;
      font-family: "Courier New", Courier, monospace; font-size: 1.45rem;
      line-height: 1.5; white-space: pre-wrap; word-break: break-word;
      text-align: left;
      text-shadow: 0 0 12px rgba(150,210,255,0.7), 0 0 24px rgba(100,180,240,0.4);
    }
  </style>
</head>
<body>
  <div id="underwater-view">
    <div id="compass">
      <div id="compass-line"></div>
      <div id="compass-ticks"></div>
      <div id="compass-library">Library</div>
    </div>
    <div id="crosshair"></div>
    <div id="boost-meter"><div id="boost-meter-fill"></div></div>
    <canvas id="canvas"></canvas>
    <div id="ocean-filter" aria-hidden="true"></div>
    <div id="prompt">Click to explore · WASD to move · Space to rise, Ctrl to lower · Shift to boost (1.5× speed) · F or L for light · Mouse to look</div>
    <button id="light-btn" type="button">Light: ON</button>
    <div id="interact-prompt"></div>
    <div id="drill-ui">
      <input type="text" id="drill-input" maxlength="100" placeholder="Write your message..." autocomplete="off" />
      <span id="drill-hint">Max 100 characters · Enter to save</span>
    </div>
    <div id="read-overlay">
      <div id="read-message"></div>
      <span id="read-close">Press E or click to close</span>
    </div>
  </div>

  <script type="module">
    import('./underwater/main.js');
  </script>
  <script>
    (function () {
      var ctx = null;
      function getCtx() {
        if (ctx) return ctx;
        var Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        ctx = new Ctx();
        return ctx;
      }
      function startBass() {
        if (ctx) {
          if (ctx.state === 'suspended') ctx.resume();
          return;
        }
        if (!getCtx()) return;
        var gain = ctx.createGain();
        gain.gain.value = 0.06;
        gain.connect(ctx.destination);
        var osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = 55;
        osc.connect(gain);
        osc.start(0);
        if (ctx.state === 'suspended') ctx.resume();
      }
      function playKsh() {
        var audioCtx = getCtx();
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        var sr = audioCtx.sampleRate;
        var length = Math.floor(sr * 0.2);
        var buffer = audioCtx.createBuffer(1, length, sr);
        var data = buffer.getChannelData(0);
        for (var i = 0; i < length; i++) {
          data[i] = (Math.random() * 2 - 1) * 0.55;
        }
        var hp = audioCtx.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.value = 120;
        var bp = audioCtx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = 1100;
        bp.Q.value = 1.2;
        hp.connect(bp);
        bp.connect(audioCtx.destination);
        var gain = audioCtx.createGain();
        var t = audioCtx.currentTime;
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.048, t + 0.07);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        gain.connect(hp);
        var source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(gain);
        source.start(0);
      }
      var moveKeys = { KeyW: false, KeyA: false, KeyS: false, KeyD: false };
      var moveKeyList = ['KeyW', 'KeyA', 'KeyS', 'KeyD'];
      window.addEventListener('keydown', function (e) {
        if (moveKeyList.indexOf(e.code) === -1 || e.repeat) return;
        var otherDown = moveKeyList.some(function (k) { return k !== e.code && moveKeys[k]; });
        if (!otherDown) playKsh();
        moveKeys[e.code] = true;
      });
      window.addEventListener('keyup', function (e) {
        if (moveKeyList.indexOf(e.code) !== -1) moveKeys[e.code] = false;
      });
      document.body.addEventListener('click', function once() {
        startBass();
        document.body.removeEventListener('click', once);
      });
      window.addEventListener('load', startBass);
    })();
  </script>
</body>
</html>
