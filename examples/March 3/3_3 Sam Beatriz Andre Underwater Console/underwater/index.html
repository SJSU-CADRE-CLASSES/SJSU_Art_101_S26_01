<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stone Library — Underwater</title>
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; background: #0a1628; }
    #canvas { display: block; width: 100vw; height: 100vh; }
    /* Deep ocean filter overlay — blue tint, vignette, murky feel */
    #ocean-filter {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      background:
        radial-gradient(ellipse 80% 80% at 50% 50%, transparent 30%, rgba(0,20,40,0.4) 70%, rgba(0,10,25,0.7) 100%),
        linear-gradient(180deg, rgba(0,40,80,0.15) 0%, transparent 40%, rgba(0,30,60,0.2) 100%);
      mix-blend-mode: multiply;
    }
    /* Subtle desaturation — red light absorbed in deep water */
    #canvas { filter: saturate(0.85) contrast(1.05); }
    #prompt {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.7);
      font-family: system-ui, sans-serif;
      font-size: 1rem;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="ocean-filter" aria-hidden="true"></div>
  <div id="prompt">Click to explore · WASD to move · Space/Shift to rise · F to toggle light · Mouse to look</div>
  <script type="module" src="./main.js"></script>
</body>
</html>
