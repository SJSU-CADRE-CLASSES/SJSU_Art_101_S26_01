<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stone Library — Underwater</title>
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; background: #0a1628; }
    #canvas { display: block; width: 100vw; height: 100vh; }
    /* Deep ocean filter overlay — blue tint, vignette, murky feel */
    #ocean-filter {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      background:
        radial-gradient(ellipse 80% 80% at 50% 50%, transparent 30%, rgba(0,20,40,0.4) 70%, rgba(0,10,25,0.7) 100%),
        linear-gradient(180deg, rgba(0,40,80,0.15) 0%, transparent 40%, rgba(0,30,60,0.2) 100%);
      mix-blend-mode: multiply;
    }
    /* Subtle desaturation — red light absorbed in deep water */
    #canvas { filter: saturate(0.85) contrast(1.05); }
    #prompt {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.7);
      font-family: system-ui, sans-serif;
      font-size: 1rem;
      pointer-events: none;
      z-index: 10;
    }
    #light-btn {
      position: fixed;
      top: 2.75rem;
      right: 1rem;
      padding: 0.5rem 1rem;
      background: rgba(0,40,80,0.6);
      border: 1px solid rgba(100,180,220,0.5);
      color: #7ab8d4;
      font-family: system-ui, sans-serif;
      font-size: 0.9rem;
      cursor: pointer;
      z-index: 10;
      border-radius: 4px;
    }
    #light-btn:hover { background: rgba(0,60,100,0.8); }
    #light-btn.on { background: rgba(20,80,120,0.9); box-shadow: 0 0 12px rgba(122,184,212,0.4); }
    #compass {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 280px;
      height: 40px;
      overflow: hidden;
      z-index: 10;
      pointer-events: none;
    }
    #compass-line {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(120,180,220,0.6) 10%, rgba(120,180,220,0.8) 50%, rgba(120,180,220,0.6) 90%, transparent);
    }
    #compass-ticks {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 720px;
      height: 20px;
      margin: -10px 0 0 -360px;
      transform: translateX(0);
      transition: transform 0.08s ease-out;
    }
    .compass-tick {
      position: absolute;
      top: 50%;
      width: 1px;
      background: rgba(140,200,240,0.5);
      left: 0;
      transform: translateY(-50%);
    }
    .compass-tick.small { height: 6px; }
    .compass-tick.cardinal { height: 12px; background: rgba(170,220,255,0.9); }
    .compass-tick.cardinal::after {
      content: attr(data-dir);
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translate(-50%, 0);
      font-size: 9px;
      font-family: system-ui, sans-serif;
      color: rgba(180,220,255,0.95);
      white-space: nowrap;
    }
    #compass-library {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 10px;
      color: #aae5ff;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
    }
    #compass-library.visible { opacity: 1; }
    #compass-library::before { content: '◉'; margin-right: 3px; font-size: 8px; vertical-align: middle; }
    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      border: 1px solid rgba(180,190,200,0.7);
      background: transparent;
      pointer-events: none;
      z-index: 12;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    #crosshair.interactable {
      border-color: rgba(255,255,255,0.95);
      box-shadow: 0 0 6px rgba(255,255,255,0.4);
    }
    #interact-prompt {
      position: fixed;
      bottom: 25%;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(200,230,255,0.95);
      font-family: system-ui, sans-serif;
      font-size: 1rem;
      pointer-events: none;
      z-index: 15;
      opacity: 0;
      transition: opacity 0.2s;
    }
    #interact-prompt.visible { opacity: 1; }
    #drill-ui {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 25%;
      pointer-events: none;
    }
    #drill-ui.active { display: flex; pointer-events: auto; }
    #drill-input {
      width: min(400px, 90vw);
      padding: 0.75rem 1rem;
      font-size: 1rem;
      font-family: system-ui, sans-serif;
      background: rgba(0,30,50,0.9);
      border: 1px solid rgba(100,180,220,0.5);
      color: #e0f0ff;
      border-radius: 6px;
      outline: none;
    }
    #drill-input::placeholder { color: rgba(180,220,255,0.5); }
    #drill-hint {
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: rgba(160,200,230,0.7);
    }
    #read-close {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(180,220,255,0.8);
      font-size: 0.9rem;
    }
    #read-overlay {
      position: fixed;
      inset: 0;
      z-index: 25;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,15,30,0.85);
      pointer-events: none;
    }
    #read-overlay.active { display: flex; pointer-events: auto; }
    #read-message {
      max-width: 400px;
      padding: 1.5rem;
      background: rgba(0,35,60,0.95);
      border: 1px solid rgba(80,150,200,0.4);
      border-radius: 8px;
      color: #c8e4ff;
      font-family: system-ui, sans-serif;
      font-size: 1.1rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div id="compass">
    <div id="compass-line"></div>
    <div id="compass-ticks"></div>
    <div id="compass-library">Library</div>
  </div>
  <div id="crosshair"></div>
  <canvas id="canvas"></canvas>
  <div id="ocean-filter" aria-hidden="true"></div>
  <div id="prompt">Click to explore · WASD to move · Space/Shift to rise · F or L to toggle light · Mouse to look</div>
  <button id="light-btn" type="button">Light: OFF</button>
  <div id="interact-prompt"></div>
  <div id="drill-ui">
    <input type="text" id="drill-input" maxlength="100" placeholder="Write your message..." autocomplete="off" />
    <span id="drill-hint">Max 100 characters · Enter to save</span>
  </div>
  <div id="read-overlay">
    <div id="read-message"></div>
    <span id="read-close">Press E or click to close</span>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
